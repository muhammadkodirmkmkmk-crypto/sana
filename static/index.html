html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit}
.hide{display:none!important}

header{position:sticky;top:0;z-index:30;background:var(--navy);color:#fff;
  padding:calc(env(safe-area-inset-top) + 9px) var(--pad) 9px;
  display:flex;align-items:center;gap:11px;box-shadow:0 2px 10px rgba(0,0,0,.12);
  border-bottom:3px solid var(--gold)}
header .logo{width:56px;height:34px;object-fit:contain;flex:none;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
header h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em;flex:1}
header h1 small{display:block;font-size:11.5px;font-weight:400;color:#b9c6d4;letter-spacing:0}
.hbtn{border:1px solid rgba(255,255,255,.35);border-radius:9px;padding:5px 10px;
  font-size:12.5px;font-weight:700;color:#fff}

nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;
  border-top:1px solid var(--line);display:grid;padding-bottom:env(safe-area-inset-bottom)}
nav button{padding:9px 2px 8px;display:grid;gap:2px;justify-items:center;color:var(--muted);font-size:11px}
nav button i{font-style:normal;font-size:19px;line-height:1}
nav button.on{color:var(--navy);font-weight:700}

main{padding:12px var(--pad) 150px}
h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);
  margin:18px 0 8px;font-weight:700}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.p{background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--line);
  display:flex;flex-direction:column;text-align:left;transition:transform .07s}
.p:active{transform:scale(.975)}
.p img{width:100%;aspect-ratio:11/9;object-fit:cover;display:block;background:#fafafa}
.p .n{padding:9px 10px 4px;font-weight:700;font-size:15px;letter-spacing:-.01em}
.p .s{padding:0 10px 9px;font-size:11.5px;color:var(--muted)}
.p.out{opacity:.45}
.p.out .s{color:var(--bad)}

.sheet-bg{position:fixed;inset:0;background:rgba(6,15,24,.55);z-index:40;opacity:0;
  pointer-events:none;transition:opacity .18s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:#fff;
  border-radius:20px 20px 0 0;padding:8px var(--pad) calc(16px + env(safe-area-inset-bottom));
  transform:translateY(101%);transition:transform .22s cubic-bezier(.3,.8,.4,1);max-height:92vh;overflow:auto}
.sheet.on{transform:none}
.grip{width:40px;height:4px;border-radius:2px;background:#d7dde3;margin:6px auto 12px}
.sh-h{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.sh-h img{width:64px;height:56px;border-radius:11px;object-fit:cover;flex:none}
.sh-h b{font-size:19px;letter-spacing:-.02em;display:block}
.sh-h span{font-size:12.5px;color:var(--muted)}

.packs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px}
.pack{border:1.5px solid var(--line);border-radius:13px;padding:11px 6px;text-align:center;background:#fff}
.pack b{display:block;font-size:17px;font-weight:750;letter-spacing:-.02em}
.pack span{display:block;font-size:11.5px;color:var(--ink2);margin-top:3px}
.pack small{display:block;font-size:10.5px;color:var(--muted);margin-top:3px}
.pack.on{border-color:var(--navy);background:#f4f7fa;box-shadow:0 0 0 1px var(--navy) inset}
.pack.no{opacity:.4}

.qty{display:flex;align-items:center;gap:14px;justify-content:center;margin-bottom:8px}
.qty button{width:56px;height:56px;border-radius:16px;background:#eef1f4;font-size:27px;font-weight:600;
  display:grid;place-items:center;color:var(--navy)}
.qty input{width:104px;height:56px;text-align:center;font-size:27px;font-weight:750;
  border:1.5px solid var(--line);border-radius:16px;letter-spacing:-.02em}
.qty-l{text-align:center;font-size:12.5px;color:var(--muted);margin-bottom:14px}
.sum-row{display:flex;justify-content:space-between;align-items:baseline;
  padding:12px 2px;border-top:1px solid var(--line);margin-bottom:12px}
.sum-row span{color:var(--ink2);font-size:14px}
.sum-row b{font-size:24px;font-weight:750;letter-spacing:-.02em}

.btn{width:100%;height:56px;border-radius:16px;font-size:17px;font-weight:700;display:grid;place-items:center}
.btn.dark{background:var(--navy);color:#fff}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn.ghost{background:#eef1f4;color:var(--navy)}
.btn.red{background:#fdecec;color:var(--bad)}
.btn.sm{height:44px;font-size:14px;border-radius:13px}
.btn:active{opacity:.85}

.cart{position:fixed;left:0;right:0;z-index:25;padding:0 var(--pad) 8px;
  transform:translateY(140%);transition:transform .2s}
.cart.on{transform:none}
.cart button{width:100%;background:var(--navy);color:#fff;border-radius:15px;padding:12px 16px;
  display:flex;align-items:center;gap:12px;box-shadow:0 8px 22px rgba(10,39,61,.3)}
.cart .c{background:var(--gold);color:var(--navy);min-width:26px;height:26px;border-radius:8px;
  display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.cart .t{flex:1;text-align:left;font-size:13px;color:#b9c6d4}
.cart .t b{display:block;font-size:17px;color:#fff;font-weight:750;letter-spacing:-.01em}
.cart .go{font-size:14px;font-weight:700}

.li{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}
.li img{width:46px;height:40px;border-radius:9px;object-fit:cover;flex:none}
.li .m{flex:1;min-width:0}
.li .m b{font-size:15px;font-weight:650;display:block}
.li .m span{font-size:12px;color:var(--muted)}
.li .r b{font-size:15px;font-weight:700;white-space:nowrap}
.li .x{width:34px;height:34px;border-radius:10px;background:#f4f6f8;color:var(--bad);
  display:grid;place-items:center;font-size:17px;flex:none}

.pays{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 16px}
.pay{border:1.5px solid var(--line);border-radius:13px;padding:14px 8px;text-align:center;font-size:14px;font-weight:600}
.pay.on{border-color:var(--navy);background:#f4f7fa;box-shadow:0 0 0 1px var(--navy) inset}

.ok{text-align:center;padding:22px 10px 6px}
.ok .tick{width:76px;height:76px;border-radius:50%;background:#e8f7e8;color:var(--good);
  display:grid;place-items:center;font-size:40px;margin:0 auto 14px}
.ok h3{margin:0 0 4px;font-size:22px;letter-spacing:-.02em}
.ok p{margin:0;color:var(--ink2);font-size:14px}
.ok .amt{font-size:32px;font-weight:750;letter-spacing:-.03em;margin:12px 0 2px}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 15px;margin-bottom:10px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi .l{font-size:12px;color:var(--ink2)}
.kpi .v{font-size:23px;font-weight:750;letter-spacing:-.025em;margin-top:3px}
.kpi .v small{font-size:13px;font-weight:600;color:var(--ink2)}
.kpi .m{font-size:11.5px;color:var(--muted);margin-top:2px}
.kpi.good .v{color:var(--good)} .kpi.bad .v{color:var(--bad)}

table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:right;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);
  padding:0 0 7px;font-weight:700}
th:first-child{text-align:left}
td{padding:9px 0;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
td:first-child{text-align:left;font-weight:600}
tr.low td{color:var(--bad)}
tr.click{cursor:pointer}
.bar{height:7px;border-radius:4px;background:#eceff2;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:4px;background:var(--navy)}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:5px;font-weight:600}
.field input,.field select{width:100%;height:50px;padding:0 13px;border:1.5px solid var(--line);
  border-radius:13px;font-size:16px;background:#fff}
.note{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.menu button{width:100%;display:flex;align-items:center;gap:12px;padding:15px 15px;
  background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;text-align:left}
.menu button i{font-style:normal;font-size:20px;width:26px;text-align:center;color:var(--navy)}
.menu button .m{flex:1}
.menu button b{display:block;font-size:15.5px;font-weight:650}
.menu button span{font-size:12px;color:var(--muted)}
.menu button .ar{color:var(--muted);font-size:18px}

.back{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:650;
  color:var(--navy);margin-bottom:10px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:7px}
.pill.g{background:#e8f7e8;color:var(--good)} .pill.r{background:#fdecec;color:var(--bad)}
.pill.y{background:#fdf3e0;color:var(--warn)} .pill.n{background:#eef1f4;color:var(--ink2)}

.inv-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.inv-row .nm{flex:1;font-weight:600;font-size:14px}
.inv-row input{width:62px;height:40px;text-align:center;border:1.5px solid var(--line);
  border-radius:10px;font-size:15px;font-weight:650}
.inv-row .d{width:74px;text-align:right;font-size:12.5px;font-weight:700}

.brandline{height:3px;border-radius:2px;background:linear-gradient(90deg,var(--gold),#f7d98a);margin:2px 0 14px}
.sh-logo{width:52px;height:31px;object-fit:contain;opacity:.9}
.tg{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;
  font-size:14px;line-height:1.6;white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace}

/* вход */
#login{position:fixed;inset:0;z-index:60;background:var(--navy);color:#fff;
  display:grid;place-items:center;padding:24px}
#login .box{width:100%;max-width:340px;text-align:center}
#login .lg{width:190px;height:auto;display:block;margin:0 auto 20px;
  filter:drop-shadow(0 4px 14px rgba(0,0,0,.35))}
#login h2{margin:0 0 4px;font-size:23px;letter-spacing:-.02em}
#login .since{font-size:11px;letter-spacing:.18em;color:var(--gold);
  text-transform:uppercase;margin:0 0 8px;font-weight:700}
#login p{margin:0 0 26px;color:#b9c6d4;font-size:14px}
#login button{width:100%;height:58px;border-radius:16px;font-size:16px;font-weight:700;
  margin-bottom:10px;background:#fff;color:var(--navy);display:flex;align-items:center;
  gap:12px;padding:0 18px;text-align:left}
#login button span{flex:1}
#login button small{font-size:11.5px;color:var(--ink2);font-weight:500;display:block}

@media (min-width:600px) and (max-width:1099px){
  body{background:#d9e0e6}
  header,main,nav,.cart,.sheet{max-width:460px;margin-left:auto;margin-right:auto}
  main{background:var(--bg);min-height:calc(100vh - 56px);box-shadow:0 0 0 1px rgba(10,39,61,.10)}
  header{box-shadow:0 2px 10px rgba(0,0,0,.12), 0 0 0 1px rgba(10,39,61,.10)}
  nav{border-left:1px solid var(--line);border-right:1px solid var(--line)}
}


/* ================= ДЕСКТОП: боковое меню + широкие таблицы ================= */
@media (min-width:1100px){
  body{background:#eaeef2}
  header{padding-left:calc(248px + 24px);padding-right:24px;height:64px;
    padding-top:0;padding-bottom:0;border-bottom:3px solid var(--gold)}
  header h1{font-size:19px}
  header .logo{width:0;height:0;margin:0;overflow:hidden}

  nav{top:0;bottom:0;right:auto;width:248px;border-top:0;border-right:1px solid var(--line);
    display:flex!important;flex-direction:column;gap:3px;padding:76px 12px 18px;z-index:31;
    background:#fff}
  nav:before{content:"";position:absolute;left:16px;top:16px;width:112px;height:38px;
    background:var(--dlogo) center/contain no-repeat}
  nav button{display:flex;align-items:center;justify-content:flex-start;gap:12px;
    height:44px;padding:0 14px;border-radius:11px;font-size:14.5px;font-weight:600}
  nav button i{font-size:18px;width:22px;text-align:center}
  nav button span{font-size:14.5px}
  nav button.on{background:#eef3f8;color:var(--navy)}
  nav button:hover{background:#f4f7fa}

  main{margin-left:248px;padding:22px 26px 48px;max-width:1240px}
  h2.sec{margin:24px 0 10px;font-size:12.5px}

  .grid{grid-template-columns:repeat(4,1fr);gap:14px}
  .p .n{font-size:15.5px;padding:11px 12px 4px}
  .p .s{padding:0 12px 11px}
  .kpis{grid-template-columns:repeat(4,1fr);gap:14px}
  .card{max-width:900px}
  .card .prices,.card .row3{max-width:520px}
  .card .xrow{max-width:560px}
  .kpi{padding:15px 17px}
  .kpi .v{font-size:26px}
  .chs{grid-template-columns:1fr 1fr;gap:12px}
  .menu{grid-template-columns:1fr 1fr;gap:10px;display:grid}
  .menu button{border-radius:14px;border:1px solid var(--line)}
  .tabs{max-width:520px}
  .alert{max-width:640px}
  table{font-size:14.5px}
  table td,table th{padding-top:11px;padding-bottom:11px}
  .card{padding:16px 18px}
  .btn{max-width:340px}
  .field input,.field select{height:46px}

  /* модальное окно вместо нижней «шторки» */
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:560px;max-height:84vh;
    border-radius:18px;padding:20px 24px 24px;
    transform:translate(-50%,-46%);opacity:0;
    transition:transform .2s cubic-bezier(.3,.8,.4,1),opacity .18s;
    box-shadow:0 24px 60px rgba(6,15,24,.35)}
  .sheet.on{transform:translate(-50%,-50%);opacity:1}
  .sheet .grip{display:none}

  .cart{left:auto;right:26px;width:360px;bottom:26px!important;padding:0}
  #login .box{max-width:520px}
}

/* ---- чеки ---- */
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;background:#e7edf3;
  padding:4px;border-radius:12px;margin-bottom:12px}
.tabs button{height:36px;border:0;border-radius:9px;background:none;font-size:13px;
  font-weight:650;color:var(--ink2);display:flex;align-items:center;justify-content:center;gap:5px}
.tabs button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(10,39,61,.12)}
.tabs button i{font-style:normal;font-size:11px;font-weight:800;background:var(--navy);color:#fff;
  min-width:18px;height:18px;line-height:18px;border-radius:9px;padding:0 4px}
.tabs button.on i{background:var(--gold);color:var(--navy)}
.chs{display:grid;gap:9px}
.ch{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:12px 14px}
.ch .a{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ch .a b{font-size:16px;font-weight:750;letter-spacing:-.02em;white-space:nowrap}
.ch .a span{font-size:12px;color:var(--muted);text-align:right}
.ch .b{display:flex;justify-content:space-between;align-items:center;margin-top:7px}
.ch .b span:last-child{font-size:12.5px;color:var(--ink2)}
.tag{font-size:11px;font-weight:750;padding:3px 8px;border-radius:7px;white-space:nowrap}
.tag.sent{background:#fff4d9;color:#8a6300}
.tag.ok{background:#e3f2e6;color:#1d7a33}
.tag.paid{background:#e6eefb;color:#1c4b95}

.pr{display:block;font-size:11px;color:var(--gold);font-weight:700}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.row3 input{width:100%;height:42px;text-align:center;border:1.5px solid var(--line);
  border-radius:10px;font-size:14.5px;font-weight:650;background:#fff}
.pl{font-size:11px;color:var(--muted);margin-bottom:3px;text-align:center}
.prices{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:9px}
.pc{background:#f4f7fa;border-radius:9px;padding:6px 4px;text-align:center}
.pc span{display:block;font-size:10.5px;color:var(--muted)}
.pc b{font-size:13px}
.pc.own{background:#fdf3dc} .pc.own b{color:#8a6300}
.er{display:flex;align-items:center;gap:9px;padding:9px 0;border-top:1px solid var(--line)}
.er img{width:40px;height:32px;object-fit:cover;border-radius:7px;flex:0 0 auto}
.er .m{flex:1;min-width:0}
.er .m b{display:block;font-size:14px}
.er .m span{font-size:11px;color:var(--muted)}
.er .f{flex:0 0 auto}
.er .f input{width:66px;height:38px;text-align:center;border:1.5px solid var(--line);
  border-radius:9px;font-size:14px;font-weight:700;background:#fff}
.er .f:last-of-type input{width:82px}
.alert{display:block;width:100%;text-align:left;background:#fff4d9;border:1px solid #f0d489;
  border-radius:14px;padding:11px 14px;margin-bottom:12px}
.xrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.xrow span{flex:1;font-size:14px;font-weight:600}
.xrow input{width:128px;height:42px;text-align:right;padding:0 11px;border:1.5px solid var(--line);
  border-radius:11px;font-size:15px;font-weight:650;background:#fff}
.xrow input.nm{flex:1;width:auto;text-align:left;font-weight:400}
.alert b{display:block;font-size:14.5px;color:#8a6300}
.alert span{font-size:12px;color:#a37b2a}
.tag.late{background:#fde8e8;color:#a32020}
.tag.n{background:#eef1f4;color:var(--ink2)}
.ch .b span:last-child{max-width:62%}
</style>

  r_top_m:"Что продали за месяц",r_top_a:"Что продавали больше всего",
  d_bycli:"По клиентам",d_byall:"Все долги",

};

let LANG = "uz";
const t = k => I18N[LANG][k] ?? k;
const $ = s => document.querySelector(s);
const fmt = n => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
/* крупные суммы человеческим языком: 251 832 000 → «251,8 mln», 45 000 → «45 ming» */
const mny = n => {
  n = Math.round(+n || 0);
  const a = Math.abs(n);
  const d = k => (n/k).toFixed(1).replace(/\.0$/,"").replace(".",",");
  if(a >= 1e9) return [d(1e9), t("u_mlrd")];
  if(a >= 1e6) return [d(1e6), t("u_mln")];
  if(a >= 1e4) return [fmt(n/1000), t("u_ming")];
  return [fmt(n), t("sum")];
};
const mnyH = n => { const [v,u] = mny(n); return `${v} <small>${u}</small>`; };
const mnyT = n => mny(n).join(" ");
const hhmm = d => String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const P = {}; PRODUCTS.forEach(p => P[p.id] = p);

/* цена: у клиента может быть своя, иначе стандартная */
const clientOf = id => S.clients.find(c => c.id === id) || null;
const liveClients = () => S.clients.filter(c => !c.archived);
const priceOf = (cid, k, pid) => {
  if(pid && (PPRICE[pid]||{})[k]) return PPRICE[pid][k];   /* своя цена товара сильнее договорной */
  const c = clientOf(cid);
  return (c && c.price && +c.price[k]) ? +c.price[k] : PRICE[k];
};
const lp = x => +x.price || bp(x.id, x.pack);     /* цена строки чека */
/* продавец цен не видит вообще: только килограммы, товар и клиент */
const SEEM = () => S.role !== "seller";

/* у части продуктов есть не все фасовки (спагетти — только 1 кг) */
const PACKS = [1,5,12];
const packsOf = p => p.packs || PACKS;
const has = (p,k) => packsOf(p).includes(+k);
const stockKg  = p => packsOf(p).reduce((a,k) => a + (p.stock[k]||0)*k, 0);
const stockSum = p => packsOf(p).reduce((a,k) => a + (p.stock[k]||0)*bp(p.id,k), 0);
const allKg  = () => PRODUCTS.reduce((a,p) => a + stockKg(p), 0);
const allSum = () => PRODUCTS.reduce((a,p) => a + stockSum(p), 0);

const S = {
  role:null, view:"sell", sub:null,
  cart:[], client:null, sales:[], log:[],
  flourIn:0, produced:0, flourLots:[], norm:NORM_DEF,
  flourPrice:0, packCost:{1:0, 5:0, 12:0},
  exp:{gaz:0, el:0, ish:0, tr:0, ij:0},
  expenses:[], supplies:[], qopUsed:0, today:null,
  clients:[{id:1,name:"Optovik Aziz",phone:"+998 90 123 45 67",price:{1:7200,5:36500,12:79000}},
           {id:2,name:"Do'kon «Baraka»",phone:"+998 91 222 33 44",price:null},
           {id:3,name:"Bozor — Sardor",phone:"+998 93 555 66 77",price:null}],
  sel:null, pack:null, qty:1, inv:null, tab:"sent", rtab:"day", cq:"", cq2:"", mdebts:[],
  dtab:"cli", dcli:null, supKind:"un", lq:"",
  inLast:{id:null, pack:null, n:""}, inFlour:{kg:"", price:""},
};

/* себестоимость одной упаковки: мука на кг / выход + упаковка */
const norm = () => (+S.norm || NORM_DEF);
/* средняя цена муки по фактическим партиям прихода */
const flourAvg = () => {
  const lots = S.flourLots.filter(l => l.kg > 0 && l.price > 0);
  const kg = lots.reduce((a,l) => a + l.kg, 0);
  return kg ? Math.round(lots.reduce((a,l) => a + l.kg*l.price, 0) / kg) : (+S.flourPrice || 0);
};
const cost = k => Math.round(k * flourAvg() / norm()) + (S.packCost[k] || 0);
const isDir  = () => S.role === "director";
const isChk  = () => S.role === "checker";
const isSell = () => S.role === "seller";
const isStore= () => S.role === "store";
const NAMES = {seller:"seller_nm", checker:"checker_nm", store:"store_nm", director:"role_d"};
const roleKey = r => ({director:"role_d", checker:"role_c", store:"role_w", seller:"role_s"})[r] || "role_s";
const whoName = r => (typeof NAMES_SRV === "object" && NAMES_SRV && NAMES_SRV[r]) || t(NAMES[r] || "role_s");

/* чеки: sent → ok (списано со склада) → paid */
const SENT = s => s.status === "sent";
const DONE = s => s.status !== "sent" && !s.returned;      /* попало в базу */
const byStatus = st => S.sales.filter(s => s.status === st).slice().reverse();
/* товар в неподтверждённых чеках зарезервирован, продать его второй раз нельзя */
const resv = (id, pack, skip) => S.sales.filter(s => SENT(s) && s.id !== skip)
  .reduce((a,s) => a + s.items.filter(x => x.id===id && +x.pack===+pack)
                              .reduce((b,x) => b+x.n, 0), 0);
const avail = (p, k, skip) => Math.max(0, (p.stock[k]||0) - resv(p.id, k, skip));

/* ---- расходы: месяц → день → на 1 кг → полная себестоимость ---- */
const MONTH_KG = Math.round(WEEK_KG * 30 / 7);           /* сколько кг завод даёт в месяц */
const XAR = [["gaz","x_gaz"],["el","x_el"],["ish","x_ish"],["tr","x_tr"],["ij","x_ij"]];
const xarMonth = () => XAR.reduce((a,[k]) => a + (+S.exp[k] || 0), 0);   /* постоянные, в месяц */
const xarDay   = () => xarMonth() / 30;
/* расходы по дням: записаны той датой, когда их вписали */
const today = () => S.today || iso(now());          /* дата завода, а не устройства */
const dayOf = s => s.day || iso(new Date(s.at));
const expList  = () => S.expenses || [];
const expDay   = d => expList().filter(e => e.day === d).reduce((a,e) => a + (+e.amount||0), 0);
const expToday = () => expDay(today());
const expMonth = () => { const m = today().slice(0,7);
  return expList().filter(e => (e.day||"").slice(0,7) === m).reduce((a,e) => a + (+e.amount||0), 0); };
const xarMonthAll = () => xarMonth() + expMonth();       /* всё, что ушло за месяц */
const xarDayAll   = () => xarDay() + expToday();         /* всё, что ушло сегодня */
const xarKg    = () => xarMonthAll() / MONTH_KG;         /* накладные на 1 кг */
const fullCost = k => cost(k) + xarKg() * k;             /* полная себестоимость упаковки */
/* средняя валовая маржа на 1 кг: по факту продаж, иначе по прайсу */
function marginKg(){
  const live = S.sales.filter(DONE);
  const kg = live.reduce((a,s) => a+s.kg, 0);
  if(kg > 0) return live.reduce((a,s) => a + s.sum - s.cost, 0) / kg;
  return [1,5,12].reduce((a,k) => a + (PRICE[k]-cost(k))/k, 0) / 3;
}

function logIt(kind, text){
  S.log.push({at:now(), day:today(), who:S.role, kind, text});
}

/* ------------------------------------------------ продажа */

function renderGrid(){
  $("#grid").innerHTML = PRODUCTS.map(p => {
    const kg = packsOf(p).reduce((a,k) => a + avail(p,k)*k, 0);

/* короткая сводка дня вместо смены: продаж столько-то, столько-то кг */
function drawDayBar(){
  const el = $("#shift-bar");

  const day = today();

                                   && (!isSell() || s.by === "seller"));

    <span class="pill n">${t("d_day")}</span>

    ${SEEM() ? `<b style="font-size:15px">${fmt(mine.reduce((a,s)=>a+s.sum,0))}</b>` : ""}</div>`;
}

function openSheet(id){ S.sel = P[id]; S.pack = null; S.qty = 1; drawSheet(); openBg(); }
function openBg(){ $("#bg").classList.add("on"); $("#sheet").classList.add("on"); }
function closeSheet(){ $("#bg").classList.remove("on"); $("#sheet").classList.remove("on"); }

function drawSheet(){
  const p = S.sel, pr = k => priceOf(S.client, k, p.id), total = S.pack ? pr(S.pack)*S.qty : 0;
  $("#sheet-in").innerHTML = `
    <div class="sh-h"><img src="${p.img}" alt="">
      <div><b>${p.name}</b><span>${t("sheet_left")}: ${packsOf(p).map(k=>`${avail(p,k)}×${k}`).join(" · ")}</span></div></div>
    <div class="packs" style="grid-template-columns:repeat(${packsOf(p).length},1fr)">${packsOf(p).map(k => `
      <button class="pack${S.pack==k?" on":""}${avail(p,k)?"":" no"}" data-k="${k}">
        <b>${k} ${t("kg")}</b><span>${SEEM() ? fmt(pr(k))+(pr(k)!==bp(p.id,k)?" ★":"")
          : fmt(avail(p,k)*k)+" "+t("kg")}</span><small>${avail(p,k)} ${t("pcs")}</small>
      </button>`).join("")}</div>
    ${S.pack ? `
      <div class="qty"><button data-d="-1">−</button>
        <input id="q" type="number" inputmode="numeric" value="${S.qty}">
        <button data-d="1">+</button></div>
      <div class="qty-l">${t("pcs")} · ${fmt(S.qty*S.pack)} ${t("kg")}</div>
      <div class="sum-row">${SEEM()
        ? `<span>${t("c_total")}</span><b>${fmt(total)} ${t("sum")}</b>`
        : `<span>${t("r_kg")}</span><b>${fmt(S.qty*S.pack)} ${t("kg")}</b>`}</div>
      <button class="btn dark" id="addbtn">${t("add")}</button>` : ""}`;
  $("#sheet-in").querySelectorAll(".pack").forEach(b => b.onclick = () => {
    if(!avail(p, b.dataset.k)) return;
    S.pack = +b.dataset.k; S.qty = 1; drawSheet();
  });
  $("#sheet-in").querySelectorAll("[data-d]").forEach(b => b.onclick = () => {
    S.qty = Math.max(1, Math.min(avail(p,S.pack), S.qty + (+b.dataset.d))); drawSheet();
  });
  const q = $("#q");
  if(q) q.oninput = () => {
    S.qty = Math.max(1, Math.min(avail(p,S.pack), +q.value||1));
    $("#sheet-in").querySelector(".sum-row b").textContent = SEEM()
      ? fmt(pr(S.pack)*S.qty)+" "+t("sum") : fmt(S.qty*S.pack)+" "+t("kg");
    $("#sheet-in").querySelector(".qty-l").textContent = t("pcs")+" · "+fmt(S.qty*S.pack)+" "+t("kg");
  };
  const ab = $("#addbtn");
  if(ab) ab.onclick = () => {
    const ex = S.cart.find(x => x.id===p.id && x.pack===S.pack);
    if(ex) ex.n = Math.min(avail(p,S.pack), ex.n + S.qty);
    else S.cart.push({id:p.id, pack:S.pack, n:S.qty, price:pr(S.pack)});
    closeSheet(); drawCart();
  };
}

const cartSum = () => S.cart.reduce((a,x)=>a+lp(x)*x.n, 0);
const cartCost = () => S.cart.reduce((a,x)=>a+cost(x.pack)*x.n, 0);
const cartCnt = () => S.cart.reduce((a,x)=>a+x.n, 0);
const cartKg  = () => S.cart.reduce((a,x)=>a+x.n*x.pack, 0);

function drawCart(){
  $("#cart-c").textContent = cartCnt();
  $("#cart-s").textContent = SEEM() ? fmt(cartSum())+" "+t("sum") : fmt(cartKg())+" "+t("kg");
  const lbl = document.querySelector('#cart .t span');
  if(lbl) lbl.textContent = SEEM() ? t("c_total") : t("r_kg");
  $("#cart").classList.toggle("on", S.cart.length>0 && S.view==="sell");
}

function drawCheck(){
  $("#sheet-in").innerHTML = `
    <div class="sh-h"><div style="flex:1"><b>${t("check")}</b>
      <span>${cartCnt()} ${t("pcs")} · ${fmt(cartKg())} ${t("kg")}</span></div>
      <button class="btn ghost" style="width:auto;height:38px;padding:0 14px;font-size:13px" id="clr">${t("clear")}</button></div>
    ${S.cart.map((x,i) => `<div class="li"><img src="${P[x.id].img}" alt="">
      <div class="m"><b>${P[x.id].name}</b><span>${x.pack} ${t("kg")} × ${x.n} ${t("pcs")}</span></div>
      <div class="r"><b>${SEEM() ? fmt(lp(x)*x.n) : fmt(x.pack*x.n)+" "+t("kg")}</b>${
        SEEM() && lp(x)!==bp(x.id,x.pack)?`<span class="pr">${fmt(lp(x))}</span>`:""}</div>
      <button class="x" data-i="${i}">✕</button></div>`).join("")}
    <div class="field" style="margin-top:14px"><label>${t("client")}</label>
      <input id="clq" placeholder="${t("cli_find")}" value="${esc(S.cq||"")}">
      <select id="cl" style="margin-top:8px">${clientOpts(S.cq)}</select></div>
    <div id="newcli"></div>
    <div class="sum-row">${SEEM()
      ? `<span>${t("c_total")}</span><b>${fmt(cartSum())} ${t("sum")}</b>`
      : `<span>${t("r_kg")}</span><b>${fmt(cartKg())} ${t("kg")}</b>`}</div>
    <button class="btn gold" id="topay">${t("send")}</button>`;
  $("#clr").onclick = () => { S.cart=[]; closeSheet(); drawCart(); };
  $("#clq").oninput = e => {
    S.cq = e.target.value;
    $("#cl").innerHTML = clientOpts(S.cq);
  };
  $("#cl").onchange = e => {
    if(e.target.value === "new"){ newClientForm(); return; }
    S.client = e.target.value ? +e.target.value : null;
    S.cart.forEach(x => x.price = priceOf(S.client, x.pack, x.id));   /* своя цена клиента */
    $("#newcli").innerHTML = "";
    drawCart(); drawCheck();
  };
  $("#sheet-in").querySelectorAll(".x").forEach(b => b.onclick = () => {
    S.cart.splice(+b.dataset.i,1); drawCart(); S.cart.length ? drawCheck() : closeSheet();
  });
  $("#topay").onclick = () => send();
}

/* список клиентов с поиском по имени и телефону */
function clientOpts(q){
  const s = (q||"").trim().toLowerCase();
  const all = liveClients();
  const list = s ? all.filter(c =>
      c.name.toLowerCase().includes(s) || (c.phone||"").replace(/\s/g,"").includes(s.replace(/\s/g,"")))
    : all;
  return `<option value="">${t("noclient")}</option>`
    + list.map(c => `<option value="${c.id}"${S.client==c.id?" selected":""}>${esc(c.name)}</option>`).join("")
    + (s && !list.length ? `<option value="" disabled>${t("cli_nf")}</option>` : "")
    + `<option value="new">${t("cli_new")}</option>`;
}

/* продавец может завести клиента прямо в чеке */
function newClientForm(){
  $("#newcli").innerHTML = `<div class="card" style="margin:0 0 12px;padding:12px 14px">

/* продавец отправляет чек на проверку — склад пока не трогаем */
function send(){
  if(API){
    const items = S.cart.map(x => ({id:x.id, pack:x.pack, n:x.n, price:lp(x)}));
    const cl = S.client, sum = cartSum(), kg = cartKg();
    apiDo("send_chek", {items, client:cl}).then(() => {
      S.cart = []; S.client = null; drawCart(); renderGrid();
      $("#sheet-in").innerHTML = `
        <div class="ok"><div class="tick">✓</div><h3>${t("sent_h")}</h3>
          <div class="amt">${SEEM() ? fmt(sum)+" "+t("sum") : fmt(kg)+" "+t("kg")}</div><p>${t("sent_p")}</p></div>
        <button class="btn dark" id="again" style="margin-top:18px">${t("ok_new")}</button>`;
      $("#again").onclick = () => { closeSheet(); renderGrid(); drawCart(); };
    });
    return;
  }
  const sum = cartSum(), kg = cartKg(), cst = cartCost();
  const sale = {id:now().getTime(), at:now(), by:S.role,
                status:"sent", pay:null, paid:0, debt:0, due:null, sum, cost:cst, kg, client:S.client, day:today(),
                items:S.cart.map(x=>({...x})), returned:false, log:[]};
  S.sales.push(sale);
  logIt("a_send", `${fmt(sum)} ${t("sum")} · ${fmt(kg)} ${t("kg")}`);
  S.cart = []; S.client = null;
  $("#sheet-in").innerHTML = `
    <div class="ok"><div class="tick">✓</div><h3>${t("sent_h")}</h3>
      <div class="amt">${SEEM() ? fmt(sum)+" "+t("sum") : fmt(kg)+" "+t("kg")}</div>
      <p>${t("sent_p")}</p></div>
    <button class="btn dark" id="again" style="margin-top:18px">${t("ok_new")}</button>`;
  $("#again").onclick = () => { closeSheet(); renderGrid(); drawCart(); };
  drawCart(); renderGrid();
}

/* ---------------- чеки: проверка, изменение, оплата ---------------- */

const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const plusDays = n => { const d = now(); d.setDate(d.getDate()+n); return iso(d); };
const daysLeft = due => Math.round((new Date(due+"T00:00:00") - new Date(iso(now())+"T00:00:00")) / 86400000);
const dueText = due => { const d = daysLeft(due);
  return d > 0 ? `${d} ${t("d_left")}` : d === 0 ? t("d_today") : `${-d} ${t("d_late")}`; };
/* долги двух видов: из чека и заведённые вручную */
const debts = () => [
    ...S.sales.filter(s => s.debt > 0 && !s.returned).map(s => ({...s, kind:"chek"})),
    ...(S.mdebts || []).map(d => ({...d, kind:"man"})),
  ].sort((a,b) => (a.due||"9999") < (b.due||"9999") ? -1 : 1);
const debtDue = () => debts().filter(s => daysLeft(s.due) <= 0);   /* срок пришёл или просрочен */
const debtSum = () => debts().reduce((a,s) => a + s.debt, 0);

const saleSum = it => it.reduce((a,x) => a + lp(x)*x.n, 0);
const saleKg  = it => it.reduce((a,x) => a + x.pack*x.n, 0);
const saleCost= it => it.reduce((a,x) => a + cost(x.pack)*x.n, 0);
const clientName = id => (S.clients.find(c => c.id === id) || {}).name || "";

function renderChek(v){

  const cur = S.tab || "sent";

    ${late.length ? `<button class="alert" id="d-go">
      <b>${late.length} ${t("d_alert")}</b>

    <div class="tabs">${tabs.map(([k,l]) => {
      const n = S.sales.filter(s => s.status===k).length;
      return `<button class="${cur===k?"on":""}" data-t="${k}">${t(l)}${n?` <i>${n}</i>`:""}</button>`;
    }).join("")}</div>
    ${list.length ? `<div class="chs">${list.map(s => `
      <button class="ch" data-s="${s.id}">
        <div class="a"><b>${fmt(s.sum)} ${t("sum")}</b>
          <span>${hhmm(s.at)} · ${whoName(s.by)}${s.client?" · "+esc(clientName(s.client)):""}</span></div>
        <div class="b"><span class="tag ${s.status}">${t(s.status==="sent"?"ch_wait":s.status==="ok"?"st_ok":"ch_paidd")}</span>
          <span>${fmt(s.kg)} ${t("kg")}${s.pay?" · "+t(s.pay):""}</span></div>
      </button>`).join("")}</div>`
      : `<p class="empty">${t("ch_none")}</p>`}`;
  v.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { S.tab = b.dataset.t; renderChek(v); });
  v.querySelectorAll("[data-s]").forEach(b => b.onclick = () => openChek(+b.dataset.s));
  const dg = $("#d-go"); if(dg) dg.onclick = () => { S.sub = "debt"; show("more"); };
}

function openChek(id){
  const s = S.sales.find(x => x.id === id); if(!s) return;
  paintChek(s); openBg();
}

function paintChek(s){
  const cl = clientName(s.client);
  const canCheck = isChk() || isDir();
  $("#sheet-in").innerHTML = `
    <div class="sh-h"><div style="flex:1"><b>${fmt(s.sum)} ${t("sum")}</b>
      <span>${hhmm(s.at)} · ${t("ch_by")}: ${whoName(s.by)}${cl?" · "+esc(cl):""}</span></div>
      <span class="tag ${s.status}">${t(s.status==="sent"?"ch_wait":s.status==="ok"?"st_ok":"ch_paidd")}</span></div>
    ${s.items.map(x => `<div class="li"><img src="${P[x.id].img}" alt="">
      <div class="m"><b>${P[x.id].name}</b><span>${x.pack} ${t("kg")} × ${x.n} ${t("pcs")}</span></div>
      <div class="r"><b>${fmt(lp(x)*x.n)}</b>${lp(x)!==bp(x.id,x.pack)?`<span class="pr">${fmt(lp(x))}</span>`:""}</div></div>`).join("")}
    <div class="sum-row"><span>${fmt(s.kg)} ${t("kg")}</span><b>${fmt(s.sum)} ${t("sum")}</b></div>
    ${s.returned ? `<p class="note">${t("returned")}</p>` : ""}
    <div id="ch-act"></div>`;
  const act = $("#ch-act");
  if(s.returned) return;

  if(s.status === "sent"){
    if(!canCheck){ act.innerHTML = `<p class="note">${t("only_check")}</p>`; return; }
    act.innerHTML = `<button class="btn gold" id="a-ok">${t("ch_ok")}</button>
      <button class="btn ghost" id="a-ed" style="margin-top:8px">${t("ch_edit")}</button>
      <button class="btn ghost" id="a-del" style="margin-top:8px;color:var(--bad)">${t("ch_del")}</button>`;
    $("#a-ok").onclick = () => confirmChek(s);
    $("#a-ed").onclick = () => editChek(s);
    $("#a-del").onclick = () => {
      if(API){ apiDo("delete_chek", {id:s.id}).then(closeSheet); return; }
      s.returned = true; s.status = "sent";
      logIt("a_del", `${fmt(s.sum)} ${t("sum")}`);
      closeSheet(); refreshChek();
    };
    return;
  }
  if(s.status === "ok"){
    if(!canCheck){ act.innerHTML = `<p class="note">${t("ch_okd")}</p>`; return; }
    act.innerHTML = `<p class="note" style="margin:2px 0 12px">${t("ch_okd")}</p>
      <div style="font-size:12.5px;color:var(--ink2);font-weight:600">${t("paytype")}</div>
      <div class="pays" id="a-pays">${[["cash",t("cash")],["card",t("card")],["transfer",t("transfer")],["click",t("click")]]
        .map(([k,n]) => `<button class="pay${s.pay===k?" on":""}" data-k="${k}">${n}</button>`).join("")}</div>
      <div class="field" style="margin-top:12px"><label>${t("paid_amt")}</label>
        <input id="a-amt" type="number" inputmode="numeric" value="${s.sum}"></div>
      <div class="row2" style="margin:-4px 0 12px">
        <button class="btn ghost sm" id="a-full">${t("pay_full")}</button>
        <button class="btn ghost sm" id="a-none" style="color:var(--bad)">${t("pay_none")}</button></div>
      <div id="a-debt"></div>
      <button class="btn gold" id="a-pay">${t("ch_pay")}</button>`;
    act.querySelectorAll(".pay").forEach(b => b.onclick = () => {
      s.pay = b.dataset.k;
      act.querySelectorAll(".pay").forEach(x => x.classList.toggle("on", x === b));
    });
    const dueBox = () => {
      const left = Math.max(0, s.sum - (+$("#a-amt").value || 0));
      $("#a-debt").innerHTML = left > 0
        ? `<div class="card" style="margin:0 0 12px;padding:12px 14px;border-left:3px solid var(--bad)">
             <div style="display:flex;justify-content:space-between;align-items:baseline">
               <span style="font-size:13px;color:var(--ink2)">${t("debt")}</span>
               <b style="font-size:18px;color:var(--bad)">${fmt(left)} ${t("sum")}</b></div>
             <div class="field" style="margin-top:10px"><label>${t("debt_due")}</label>
               <input id="a-due" type="date" value="${plusDays(3)}"></div></div>`
        : "";
    };
    $("#a-amt").oninput = dueBox;
    $("#a-full").onclick = () => { $("#a-amt").value = s.sum; dueBox(); };
    $("#a-none").onclick = () => { $("#a-amt").value = 0; dueBox(); };   /* всё в долг */
    dueBox();
    $("#a-pay").onclick = () => {
      if(!s.pay) s.pay = "cash";
      const paid = Math.max(0, Math.min(s.sum, +$("#a-amt").value || 0));
      if(API){
        apiDo("pay_chek", {id:s.id, pay:s.pay, paid,
          due: paid < s.sum ? ($("#a-due") ? $("#a-due").value : plusDays(3)) : null}).then(closeSheet);
        return;
      }
      s.paid = paid; s.debt = s.sum - paid;
      s.due = s.debt > 0 ? ($("#a-due") ? $("#a-due").value : plusDays(3)) : null;
      s.status = "paid";
      logIt("a_pay", `${fmt(paid)} ${t("sum")} · ${t(s.pay)}${s.debt?` · ${t("debt")} ${fmt(s.debt)}`:""}`);
      closeSheet(); refreshChek();
    };
    return;
  }
  /* paid */
  act.innerHTML = s.debt > 0
    ? `<div class="card" style="margin:2px 0 0;padding:12px 14px;border-left:3px solid var(--bad)">
         <table><tbody>
           <tr><td>${t("paid_amt")}</td><td>${fmt(s.paid)} ${t("sum")}</td></tr>
           <tr><td><b>${t("debt")}</b></td><td><b style="color:var(--bad)">${fmt(s.debt)} ${t("sum")}</b></td></tr>
           <tr><td>${t("debt_due")}</td><td>${s.due} · ${dueText(s.due)}</td></tr>
         </tbody></table></div>
       ${(s.pays||[]).length ? `<div class="card" style="margin:10px 0 0;padding:10px 14px">
           <div class="pl" style="text-align:left;margin-bottom:4px">${t("d_hist")}</div>
           <table><tbody>${s.pays.map(x => `<tr>
             <td style="white-space:nowrap;padding-right:12px">${hhmm(x.at)}</td>
             <td style="text-align:left;font-weight:400">${whoName(x.by)}</td>
             <td><b>${fmt(x.amount)}</b></td></tr>`).join("")}</tbody></table></div>` : ""}
       ${canCheck ? `<button class="btn gold" id="a-dc" style="margin-top:12px">${t("d_pay")}</button>` : ""}`
    : `<p class="note" style="margin-top:2px">${t("ch_paidd")} · ${t(s.pay)}</p>`;
  const dc = $("#a-dc");
  if(dc) dc.onclick = () => payDebt(s);
  if(isDir()) act.innerHTML += `<button class="btn red" id="a-ret" style="margin-top:14px">${t("ret")}</button>`;
  const rb = $("#a-ret");
  if(rb) rb.onclick = () => {
    if(API){ apiDo("return_sale", {id:s.id}).then(closeSheet); return; }
    s.items.forEach(x => { P[x.id].stock[x.pack] += x.n; });
    s.returned = true;
    logIt("a_ret", `${fmt(s.sum)} ${t("sum")}`);
    closeSheet(); refreshChek();
  };
}

/* долг можно гасить частями: клиент принёс сколько смог */
function payDebt(s){
  const paint = () => {
    $("#sheet-in").innerHTML = `
      <div class="sh-h"><div style="flex:1"><b>${t("d_pay")}</b>
        <span>${s.client?esc(clientName(s.client)):""} · ${t("debt")} ${fmt(s.debt)} ${t("sum")}</span></div></div>
      <div class="field"><label>${t("d_amt")}</label>
        <input id="dp-a" type="number" inputmode="numeric" value="${s.debt}"></div>
      <div class="pays">${[["cash",t("cash")],["card",t("card")],["transfer",t("transfer")],["click",t("click")]]
        .map(([k,n],i) => `<button class="pay${i===0?" on":""}" data-k="${k}">${n}</button>`).join("")}</div>
      <div id="dp-left" class="note"></div>
      <button class="btn gold" id="dp-go" style="margin-top:12px">${t("d_save")}</button>
      <button class="btn ghost" id="dp-bk" style="margin-top:8px;background:none">${t("back")}</button>`;
    let way = "cash";
    $("#sheet-in").querySelectorAll(".pay").forEach(b => b.onclick = () => {
      way = b.dataset.k;
      $("#sheet-in").querySelectorAll(".pay").forEach(x => x.classList.toggle("on", x === b));
    });
    const left = () => {
      const a = Math.max(0, Math.min(s.debt, +$("#dp-a").value || 0));
      $("#dp-left").textContent = a >= s.debt ? t("d_full") : `${t("d_rest")}: ${fmt(s.debt - a)} ${t("sum")}`;
    };
    $("#dp-a").oninput = left; left();
    $("#dp-bk").onclick = () => paintChek(s);
    $("#dp-go").onclick = () => {
      const a = Math.max(0, Math.min(s.debt, +$("#dp-a").value || 0));
      if(!a) return;
      if(API){ apiDo("pay_debt", {id:s.id, amount:a, way}).then(closeSheet); return; }
      s.pays = s.pays || [];
      s.pays.push({at:now(), by:S.role, amount:a, way});
      s.paid += a; s.debt -= a;
      if(s.debt <= 0){ s.debt = 0; s.due = null; }
      logIt("a_debt", `${fmt(a)} ${t("sum")}${s.client?" · "+esc(clientName(s.client)):""}${s.debt?` · ${t("d_rest")} ${fmt(s.debt)}`:""}`);
      closeSheet(); refreshChek();
    };
  };
  paint();
}

/* подтверждение: только здесь товар уходит со склада */
function confirmChek(s){
  if(API){ apiDo("confirm_chek", {id:s.id, items:s.items, client:s.client}).then(closeSheet); return; }
  s.items.forEach(x => { P[x.id].stock[x.pack] = Math.max(0, P[x.id].stock[x.pack] - x.n); });
  s.status = "ok";
  logIt("a_check", `${fmt(s.sum)} ${t("sum")} · ${fmt(s.kg)} ${t("kg")}`);
  closeSheet(); refreshChek();
}

function editChek(s){
  const draw = () => {
    $("#sheet-in").innerHTML = `
      <div class="sh-h"><div style="flex:1"><b>${t("ch_edit")}</b>
        <span>${hhmm(s.at)} · ${t("ch_by")}: ${whoName(s.by)}</span></div></div>
      ${s.items.map((x,i) => `<div class="er">
        <img src="${P[x.id].img}" alt="">
        <div class="m"><b>${P[x.id].name}</b><span>${x.pack} ${t("kg")} · ${t("avail")} ${avail(P[x.id],x.pack,s.id)}</span></div>
        <div class="f"><div class="pl">${t("pcs")}</div>
          <input class="eq" data-i="${i}" type="number" inputmode="numeric" value="${x.n}"></div>
        <div class="f"><div class="pl">${t("price")}</div>
          <input class="ep" data-i="${i}" type="number" inputmode="numeric" value="${lp(x)}"></div>
        <button class="x" data-d="${i}">✕</button></div>`).join("")}
      <div class="field" style="margin-top:12px"><label>${t("client")}</label>
        <select id="e-cl"><option value="">${t("noclient")}</option>
          ${liveClients().map(c => `<option value="${c.id}"${s.client==c.id?" selected":""}>${esc(c.name)}</option>`).join("")}
        </select></div>
      <div class="sum-row"><span>${fmt(saleKg(s.items))} ${t("kg")}</span><b>${fmt(saleSum(s.items))} ${t("sum")}</b></div>
      <button class="btn gold" id="e-go">${t("ch_save")}</button>
      <button class="btn ghost" id="e-bk" style="margin-top:8px;background:none">${t("back")}</button>`;
    const retotal = () => {
      $("#sheet-in").querySelector(".sum-row b").textContent = fmt(saleSum(s.items))+" "+t("sum");
      $("#sheet-in").querySelector(".sum-row span").textContent = fmt(saleKg(s.items))+" "+t("kg");
    };
    $("#sheet-in").querySelectorAll(".eq").forEach(inp => inp.oninput = () => {
      const x = s.items[+inp.dataset.i];
      x.n = Math.max(1, Math.min(avail(P[x.id], x.pack, s.id), +inp.value || 1));
      retotal();
    });
    $("#sheet-in").querySelectorAll(".ep").forEach(inp => inp.oninput = () => {
      s.items[+inp.dataset.i].price = Math.max(0, +inp.value || 0);
      retotal();
    });
    $("#sheet-in").querySelectorAll("[data-d]").forEach(b => b.onclick = () => {
      if(s.items.length < 2) return;
      s.items.splice(+b.dataset.d, 1); draw();
    });
    $("#e-cl").onchange = e => {
      s.client = e.target.value ? +e.target.value : null;
      s.items.forEach(x => x.price = priceOf(s.client, x.pack, x.id));   /* цены нового клиента */
      draw();
    };
    $("#e-bk").onclick = () => paintChek(s);
    $("#e-go").onclick = () => {
      s.sum = saleSum(s.items); s.kg = saleKg(s.items); s.cost = saleCost(s.items);
      logIt("a_edit", `${fmt(s.sum)} ${t("sum")}`);
      confirmChek(s);
    };
  };
  draw();
}

function refreshChek(){
  if(S.view === "chek") renderChek($("#v-chek"));
  renderGrid(); renderStock2();
}
function renderStock2(){ if(S.view === "stock") renderStock(); if(S.view === "rep") renderRep(); }

/* ------------------------------------------------ склад */

function renderStock(){
  let kg=0, sum=0;
  const perDay = WEEK_KG/7;
  const rows = PRODUCTS.map(p => {
    const k = stockKg(p);
    kg += k; sum += stockSum(p);
    const low = Math.min(...packsOf(p).map(q => p.stock[q])) < LOW;
    return `<tr class="${low?"low":""}"><td>${p.name}</td>
      ${PACKS.map(q => `<td>${has(p,q) ? p.stock[q] : "<span style='color:var(--muted)'>—</span>"}</td>`).join("")}
      <td><b>${fmt(k)}</b></td></tr>`;
  }).join("");
  $("#v-stock").innerHTML = `
    <div class="kpis">
      <div class="kpi"><div class="l">${t("st_total")}</div><div class="v">${fmt(kg)} <small>${t("kg")}</small></div>
        <div class="m">${t("st_days")} ~${(kg/perDay).toFixed(1)} ${t("days")}</div></div>
      <div class="kpi"><div class="l">${t("st_money")}</div><div class="v">${mnyH(sum)}</div>
        <div class="m">${t("st_sumtxt")}</div></div></div>
    <h2 class="sec">${t("st_h")}</h2>
    <div class="card" style="padding:12px 14px">
      <table><thead><tr><th>${t("th_prod")}</th>${[1,5,12].map(k=>`<th>${k} ${t("kg")}</th>`).join("")}
        <th>${t("th_kg")}</th></tr></thead><tbody>${rows}</tbody></table>
      <p class="note">${t("st_note")}</p></div>`;
}

/* ------------------------------------------------ отчёты */

function renderRep(){
  /* период: сегодня · этот месяц · всё время */
  const tab = S.rtab || "day";
  const inRange = s => tab === "all" ? true
    : tab === "mon" ? dayOf(s).slice(0,7) === today().slice(0,7)
    : dayOf(s) === today();
  const live = S.sales.filter(s => DONE(s) && inRange(s));
  const sum = live.reduce((a,s)=>a+s.sum,0);
  const cst = live.reduce((a,s)=>a+s.cost,0);
  const kg  = live.reduce((a,s)=>a+s.kg,0);
  const prof = sum - cst;
  const exp = Math.round(S.flourIn*norm()), diff = S.produced - exp;
  /* сколько дней покрывает выбранный период — для постоянных расходов */
  const spanDays = () => {
    const ds = S.sales.filter(DONE).map(dayOf).filter(Boolean).sort();
    if(!ds.length) return 1;
    return Math.max(1, Math.round((new Date(today()) - new Date(ds[0]))/86400000) + 1);
  };
  const xd = tab === "day" ? xarDayAll()
           : tab === "mon" ? xarMonth() + expMonth()
           : expList().reduce((a,e)=>a+(+e.amount||0),0) + xarDay()*spanDays();
  const net = prof - xd;
  const mk = marginKg();                                /* валовая маржа на 1 кг */
  const beM = mk > 0 ? xarMonthAll()/mk : 0;            /* точка безубыточности, кг/мес */
  const beD = beM/30;
  const beNow = tab === "day" ? beD : beM;              /* с чем сравнивать проданное */
  const L = k => t(k + (tab === "day" ? "" : tab === "mon" ? "_m" : "_a"));

  const by = {};
  live.forEach(s => s.items.forEach(x => {
    by[x.id] = by[x.id] || {kg:0,sum:0,prof:0};
    by[x.id].kg += x.n*x.pack; by[x.id].sum += lp(x)*x.n;
    by[x.id].prof += (lp(x)-cost(x.pack))*x.n;
  }));
  const top = Object.entries(by).sort((a,b)=>b[1].sum-a[1].sum);

  $("#v-rep").innerHTML = `
    <div class="tabs">${[["day","p_day"],["mon","p_mon"],["all","p_all"]].map(([k,l]) =>
      `<button class="${tab===k?"on":""}" data-r="${k}">${t(l)}</button>`).join("")}</div>
    <div class="kpis">
      <div class="kpi"><div class="l">${L("r_sales")}</div>
        <div class="v">${mnyH(sum)}</div>
        <div class="m">${live.length} ${t("r_checks")}</div></div>
      <div class="kpi ${net>=0?"good":"bad"}"><div class="l">${t("r_net")}</div>
        <div class="v">${mnyH(net)}</div>
        <div class="m">${net>=0&&sum?Math.round(100*net/sum)+"% · ":""}${L("r_netd")}</div></div>
      <div class="kpi"><div class="l">${t("r_kg")}</div><div class="v">${fmt(kg)} <small>${t("kg")}</small></div></div>
      <div class="kpi"><div class="l">${t("st_money")}</div>
        <div class="v">${mnyH(allSum())}</div></div>
    </div>

    <h2 class="sec">${t("r_xar")}</h2>
    <div class="card">
      <table><tbody>
        <tr><td>${t("r_gross")}</td><td>${fmt(prof)} ${t("sum")}</td></tr>
        <tr><td>${L("r_xday")}</td><td>− ${fmt(xd)} ${t("sum")}</td></tr>
        <tr><td><b>${t("r_net")}</b></td>
          <td><b style="color:${net>=0?"var(--good)":"var(--bad)"}">${fmt(net)} ${t("sum")}</b></td></tr>
        <tr><td>${t("x_kg")}</td><td>${fmt(xarKg())} ${t("sum")}</td></tr>
      </tbody></table>
      <p class="note">${xarMonthAll() ? t("x_note") : t("e_xar")}</p></div>

    <h2 class="sec">${t("r_be")}</h2>
    <div class="card">
      ${beM > 0 ? `<table><tbody>
        <tr><td>${t("be_m")}</td><td><b>${fmt(beM)} ${t("kg")}</b></td></tr>
        <tr><td>${t("be_d")}</td><td>${fmt(beD)} ${t("kg")}</td></tr>
        <tr><td>${L("be_now")}</td>
          <td><b style="color:${kg>=beNow?"var(--good)":"var(--bad)"}">${fmt(kg)} ${t("kg")}</b></td></tr>
      </tbody></table>
      <div class="bar"><i style="width:${beNow?Math.min(100,100*kg/beNow):0}%;background:${kg>=beNow?"var(--good)":"var(--bad)"}"></i></div>
      <p class="note">${kg>=beNow ? t("be_ok") : t("be_bad")}</p>`
      : `<p class="empty">${t("e_be")}</p>`}</div>

    <h2 class="sec">${t("r_flour")}</h2>
    <div class="card">
      <table><tbody>
        <tr><td>${t("r_in")}</td><td>${fmt(S.flourIn)} ${t("kg")}</td></tr>
        <tr><td>${t("r_exp")} ${Math.round(norm()*100)}%</td><td>${fmt(exp)} ${t("kg")}</td></tr>
        <tr><td>${t("r_got")}</td><td>${fmt(S.produced)} ${t("kg")}</td></tr>
        <tr><td>${t("r_diff")}</td><td><b style="color:${diff<0?"var(--bad)":"var(--good)"}">${diff>0?"+":""}${fmt(diff)} ${t("kg")}</b></td></tr>
      </tbody></table>
      <div class="bar"><i style="width:${S.flourIn?Math.min(100,100*S.produced/exp):0}%;background:${diff<0?"var(--bad)":"var(--good)"}"></i></div>
      <p class="note">${!S.flourIn ? t("e_flour") : diff<0?t("f_bad"):t("f_ok")}</p></div>

    <h2 class="sec">${t("r_margins")}</h2>
    <div class="card" style="padding:12px 14px">
      <table><thead><tr><th>${t("i_pack")}</th><th>${t("th_price")}</th><th>${t("th_full")}</th><th>${t("th_net")}</th></tr></thead>
      <tbody>${[1,5,12].map(k=>{
        const f=fullCost(k), m=PRICE[k]-f;
        return `<tr><td>${k} ${t("kg")}</td><td>${fmt(PRICE[k])}</td>
          <td>${f ? fmt(f) : t("e_dash")}</td>
          <td>${f ? `<b style="color:${m>0?"var(--good)":"var(--bad)"}">${fmt(m)} · ${Math.round(100*m/PRICE[k])}%</b>`
                  : `<span style="color:var(--muted)">${t("e_dash")}</span>`}</td></tr>`;
      }).join("")}</tbody></table>
      <p class="note">${S.flourPrice ? t("full_note") : t("e_cost")}</p></div>

    <h2 class="sec">${L("r_top")}</h2>
    <div class="card" style="padding:12px 14px">
      ${top.length ? `<table><tbody>${top.map(([id,v])=>
        `<tr><td>${P[id].name}</td><td>${fmt(v.kg)} ${t("kg")}</td><td><b>${fmt(v.sum)}</b></td></tr>`).join("")}</tbody></table>`
      : `<p class="empty">${t("r_none")}</p>`}</div>

          value="${S.inLast.n}"></div>

    <h2 class="sec">${t("w_today")}</h2>
    <div class="card" id="in-log"></div>`;
  if(sub) wireBack();
  const hist = () => {
    const rows = S.log.filter(l => l.kind === "a_in").slice(-8).reverse();
    $("#in-log").innerHTML = rows.length
      ? `<table><tbody>${rows.map(l => `<tr><td style="white-space:nowrap;padding-right:12px">${hhmm(l.at)}</td>
          <td style="text-align:left;font-weight:400">${esc(l.text)}</td></tr>`).join("")}</tbody></table>
         <p class="note">${t("w_norm")}: ${fmt(Math.round(S.flourIn*norm()))} ${t("kg")} · ${t("w_got")}: ${fmt(S.produced)} ${t("kg")}</p>`
      : `<p class="empty">${t("w_none")}</p>`;
  };
  hist();
  /* список фасовок зависит от выбранного продукта */
  const fillPacks = () => {
    const packs = packsOf(P[$("#in-p").value]);
    const keep = packs.includes(+S.inLast.pack) ? +S.inLast.pack : packs[0];
    $("#in-pack").innerHTML = packs.map(k =>
      `<option value="${k}"${k===keep?" selected":""}>${k} ${t("kg")}</option>`).join("");
  };
  $("#in-p").onchange = () => { S.inLast.id = $("#in-p").value; fillPacks(); };
  $("#in-pack").onchange = () => { S.inLast.pack = +$("#in-pack").value; };
  $("#in-cnt").oninput = () => { S.inLast.n = $("#in-cnt").value; };
  $("#in-flour").oninput = () => { S.inFlour.kg = $("#in-flour").value; };
  $("#in-fprice").oninput = () => { S.inFlour.price = $("#in-fprice").value; };
  fillPacks();
  $("#in-flour-go").onclick = () => {
    const kg = +$("#in-flour").value, pr = +$("#in-fprice").value || flourAvg();
    if(kg <= 0) return;
    S.inFlour = {kg: $("#in-flour").value, price: $("#in-fprice").value};   /* остаётся в полях */
    if(API){ apiDo("add_flour", {kg, price:pr}); flash($("#in-flour-go")); return; }
    S.flourIn += kg;
    S.flourLots.push({at:now(), kg, price:pr});               /* партия со своей ценой */
    logIt("a_flour", `${fmt(kg)} ${t("kg")} × ${fmt(pr)}`);
    flash($("#in-flour-go")); renderIn(v0);
  };
  $("#in-go").onclick = () => {
    const id=$("#in-p").value, pack=$("#in-pack").value, n=+$("#in-cnt").value;
    if(n <= 0) return;
    S.inLast = {id, pack:+pack, n: $("#in-cnt").value};       /* остаётся в полях */
    if(API){ apiDo("add_stock", {id, pack:+pack, n}); flash($("#in-go")); return; }
    P[id].stock[pack] += n; S.produced += n*(+pack);
    logIt("a_in", `${P[id].name} ${pack}${t("kg")} × ${n}`);
    flash($("#in-go")); renderGrid(); hist();
  };
}

/* ---------------- долги ---------------- */
function renderDebt(v){
  const list = debts();
  const tab = S.dtab || "cli";
  v.innerHTML = backBtn() + `<h2 class="sec">${t("m_debt")}</h2>
    <div class="kpis">
      <div class="kpi ${debtSum()?"bad":""}"><div class="l">${t("d_total")}</div>
        <div class="v">${mnyH(debtSum())}</div>
        <div class="m">${list.length} ${t("r_checks")}</div></div>
      <div class="kpi ${debtDue().length?"bad":"good"}"><div class="l">${t("d_now")}</div>
        <div class="v">${debtDue().length}</div>
        <div class="m">${t("d_nowm")}</div></div>
    </div>
    <button class="btn gold" id="d-add" style="margin-top:12px">${t("d_new")}</button>
    <div id="d-form"></div>
    <div class="tabs" style="grid-template-columns:1fr 1fr;margin-top:12px">
      <button class="${tab==="cli"?"on":""}" data-t="cli">${t("d_bycli")}</button>
      <button class="${tab==="all"?"on":""}" data-t="all">${t("d_byall")}</button></div>
    ${tab === "cli" ? cliBlock() : allBlock(list)}`;
  wireBack();
  v.querySelectorAll("[data-t]").forEach(b => b.onclick = () => {
    S.dtab = b.dataset.t; S.dcli = null; renderDebt(v); });
  v.querySelectorAll("[data-c]").forEach(b => b.onclick = () => {
    S.dcli = b.dataset.c === "0" ? 0 : +b.dataset.c; renderDebt(v); });
  const bk = $("#d-bk3"); if(bk) bk.onclick = () => { S.dcli = null; renderDebt(v); };
  v.querySelectorAll("[data-s]").forEach(b => b.onclick = () =>
    b.dataset.k === "man" ? openDebt(+b.dataset.s) : openChek(+b.dataset.s));
  $("#d-add").onclick = () => newDebtForm(v);

  /* один долг — строкой */
  function row(s){
    const d = daysLeft(s.due);
    return `<button class="ch" data-s="${s.id}" data-k="${s.kind}">
      <div class="a"><b>${fmt(s.debt)} ${t("sum")}</b>
        <span>${s.client?esc(clientName(s.client)):t("noclient")}</span></div>
      <div class="b"><span class="tag ${!s.due?"ok":d>0?"ok":d===0?"sent":"late"}">${s.due?dueText(s.due):t("d_nodue")}</span>
        <span>${s.kind==="man"?t("d_manual")+" · ":""}${t("paid_amt")} ${fmt(s.paid)}</span></div>
    </button>`;
  }
  function allBlock(l){
    return l.length ? `<div class="chs">${l.map(row).join("")}</div>`
                    : `<p class="empty">${t("d_none")}</p>`;
  }
  /* долги, собранные по клиентам: кто сколько должен всего */
  function cliBlock(){
    if(S.dcli !== null && S.dcli !== undefined){
      const mine = list.filter(s => (s.client || 0) === S.dcli);
      return `<button class="back" id="d-bk3" style="margin-top:4px">← ${t("d_bycli")}</button>
        <div class="card" style="display:flex;justify-content:space-between;align-items:baseline">
          <b style="font-size:16px">${S.dcli ? esc(clientName(S.dcli)) : t("noclient")}</b>
          <b style="font-size:17px;color:var(--bad)">${fmt(mine.reduce((a,s)=>a+s.debt,0))} ${t("sum")}</b></div>
        ${allBlock(mine)}`;
    }
    const m = {};
    list.forEach(s => {
      const k = s.client || 0;
      m[k] = m[k] || {id:k, sum:0, n:0, due:null};
      m[k].sum += s.debt; m[k].n++;
      if(s.due && (!m[k].due || s.due < m[k].due)) m[k].due = s.due;
    });
    const rows = Object.values(m).sort((a,b) => b.sum - a.sum);
    if(!rows.length) return `<p class="empty">${t("d_none")}</p>`;
    return `<div class="chs">${rows.map(c => {
      const d = c.due ? daysLeft(c.due) : null;
      return `<button class="ch" data-c="${c.id}">
        <div class="a"><b>${fmt(c.sum)} ${t("sum")}</b>
          <span>${c.id ? esc(clientName(c.id)) : t("noclient")}</span></div>
        <div class="b"><span class="tag ${c.due===null?"ok":d>0?"ok":d===0?"sent":"late"}">${
          c.due ? dueText(c.due) : t("d_nodue")}</span>
          <span>${c.n} ${t("r_checks")} · ${t("d_open")}</span></div>
      </button>`; }).join("")}</div>`;
  }
}

/* карточка ручного долга */
function openDebt(id){
  const d = (S.mdebts || []).find(x => x.id === id); if(!d) return;
  const cl = clientName(d.client);
  const paint = () => {
    $("#sheet-in").innerHTML = `
      <div class="sh-h"><div style="flex:1"><b>${fmt(d.debt)} ${t("sum")}</b>
        <span>${cl?esc(cl):t("noclient")} · ${t("d_manual")}</span></div>
        <span class="tag ${!d.due?"ok":daysLeft(d.due)<0?"late":"sent"}">${d.due?dueText(d.due):t("d_nodue")}</span></div>
      <div class="card" style="margin:2px 0 0;padding:12px 14px">
        <table><tbody>
          <tr><td>${t("d_amt2")}</td><td>${fmt(d.amount)} ${t("sum")}</td></tr>
          <tr><td>${t("paid_amt")}</td><td>${fmt(d.paid)} ${t("sum")}</td></tr>
          <tr><td><b>${t("debt")}</b></td><td><b style="color:var(--bad)">${fmt(d.debt)} ${t("sum")}</b></td></tr>
          ${d.due?`<tr><td>${t("debt_due")}</td><td>${d.due}</td></tr>`:""}
        </tbody></table>
        ${d.note?`<p class="note">${esc(d.note)}</p>`:""}</div>
      ${(d.pays||[]).length ? `<div class="card" style="margin:10px 0 0;padding:10px 14px">
        <div class="pl" style="text-align:left;margin-bottom:4px">${t("d_hist")}</div>
        <table><tbody>${d.pays.map(x => `<tr>
          <td style="white-space:nowrap;padding-right:12px">${hhmm(new Date(x.at))}</td>
          <td style="text-align:left;font-weight:400">${whoName(x.by)}</td>
          <td><b>${fmt(x.amount)}</b></td></tr>`).join("")}</tbody></table></div>` : ""}
      <div class="field" style="margin-top:12px"><label>${t("d_amt")}</label>
        <input id="md-a" type="number" inputmode="numeric" value="${d.debt}"></div>
      <div class="pays">${[["cash",t("cash")],["card",t("card")],["transfer",t("transfer")],["click",t("click")]]
        .map(([k,n],i) => `<button class="pay${i===0?" on":""}" data-k="${k}">${n}</button>`).join("")}</div>
      <button class="btn gold" id="md-go">${t("d_save")}</button>
      ${isDir()?`<button class="btn ghost" id="md-x" style="margin-top:8px;color:var(--bad)">${t("d_cancel")}</button>`:""}`;
    let way = "cash";
    $("#sheet-in").querySelectorAll(".pay").forEach(b => b.onclick = () => {
      way = b.dataset.k;
      $("#sheet-in").querySelectorAll(".pay").forEach(x => x.classList.toggle("on", x === b));
    });
    $("#md-go").onclick = () => {
      const a = Math.max(0, Math.min(d.debt, +$("#md-a").value || 0));
      if(!a) return;
      if(API){ apiDo("pay_debt_manual", {id:d.id, amount:a, way}).then(() => { closeSheet(); refreshDebt(); }); return; }
      d.pays = d.pays || []; d.pays.push({at:now(), by:S.role, amount:a, way});
      d.paid += a; d.debt -= a;
      if(d.debt <= 0){ S.mdebts = S.mdebts.filter(x => x.id !== d.id); }
      logIt("a_debt", fmt(a));
      closeSheet(); refreshDebt();
    };
    const x = $("#md-x");
    if(x) x.onclick = () => {
      if(API){ apiDo("del_debt", {id:d.id}).then(() => { closeSheet(); refreshDebt(); }); return; }
      S.mdebts = S.mdebts.filter(y => y.id !== d.id);
      closeSheet(); refreshDebt();
    };
  };
  paint(); openBg();
}
function refreshDebt(){ if(S.view === "more" && S.sub === "debt") renderDebt($("#v-more")); }

    S.supplies.push({id:now().getTime(), at:now(), ...data, sum:qty*price,
                     debt:qty*price - paid, by:S.role, pays:[]});
    if(kind === "un"){ S.flourIn += qty; S.flourLots.push({at:now(), kg:qty, price:price||flourAvg()}); }
    logIt("a_sup", `${kind==="un"?t("sup_kun"):t("sup_kqop")} ${fmt(qty)} × ${fmt(price)}`);
    renderSup(v);
  };
  const fx = $("#sp-fxgo");
  if(fx) fx.onclick = () => {
    const l = Math.max(0, +$("#sp-fx").value || 0);
    if(API){ apiDo("set_qop", {left:l}).then(() => renderSup(v)); return; }
    S.qopUsed = Math.max(0, got - l);
    logIt("a_qop", fmt(l)); renderSup(v);
  };
  v.querySelectorAll("[data-s]").forEach(b => b.onclick = () => openSup(+b.dataset.s, v));
}

/* карточка поставки: погасить долг или удалить запись */
function openSup(id, v){
  const x = (S.supplies || []).find(y => y.id === id); if(!x) return;
  $("#sheet-in").innerHTML = `
    <div class="sh-h"><div style="flex:1"><b>${fmt(x.qty)} ${x.kind==="un"?t("kg"):t("pcs")}</b>
      <span>${esc(x.who||t("sup_noname"))} · ${x.kind==="un"?t("sup_kun"):t("sup_kqop")}</span></div>
      <span class="tag ${x.debt>0?"late":"ok"}">${x.debt>0?t("debt"):t("d_close")}</span></div>
    <div class="card" style="margin:2px 0 0;padding:12px 14px"><table><tbody>
      <tr><td>${t("sup_price")}</td><td>${fmt(x.price)} ${t("sum")}</td></tr>
      <tr><td>${t("c_total")}</td><td><b>${fmt(x.sum)} ${t("sum")}</b></td></tr>
      <tr><td>${t("paid_amt")}</td><td>${fmt(x.paid)} ${t("sum")}</td></tr>
      ${x.debt>0?`<tr><td><b>${t("debt")}</b></td><td><b style="color:var(--bad)">${fmt(x.debt)} ${t("sum")}</b></td></tr>`:""}
      ${x.due?`<tr><td>${t("debt_due")}</td><td>${x.due} · ${dueText(x.due)}</td></tr>`:""}
    </tbody></table>${x.note?`<p class="note">${esc(x.note)}</p>`:""}</div>
    ${x.debt>0 ? `<div class="field" style="margin-top:12px"><label>${t("d_amt")}</label>
      <input id="su-a" type="number" inputmode="numeric" value="${x.debt}"></div>
      <button class="btn gold" id="su-go">${t("d_save")}</button>` : ""}
    ${isDir()?`<button class="btn ghost" id="su-x" style="margin-top:8px;color:var(--bad)">${t("sup_del")}</button>`:""}`;
  openBg();
  const go = $("#su-go");
  if(go) go.onclick = () => {
    const a = Math.max(0, Math.min(x.debt, +$("#su-a").value || 0));
    if(!a) return;
    if(API){ apiDo("pay_supply", {id:x.id, amount:a}).then(() => { closeSheet(); renderSup(v); }); return; }
    x.pays = x.pays || []; x.pays.push({at:now(), by:S.role, amount:a});
    x.paid += a; x.debt -= a;
    logIt("a_sup_pay", fmt(a));
    closeSheet(); renderSup(v);
  };
  const del = $("#su-x");
  if(del) del.onclick = () => {
    if(API){ apiDo("del_supply", {id:x.id}).then(() => { closeSheet(); renderSup(v); }); return; }
    S.supplies = S.supplies.filter(y => y.id !== x.id);
    closeSheet(); renderSup(v);
  };
}

function wireBack(){ const b=$("#bk2"); if(b) b.onclick = () => { S.sub=null; renderMore(); }; }

function renderSub(){
  const v = $("#v-more");
  if(S.sub === "in")  return renderIn(v);
  if(S.sub === "debt") return renderDebt(v);
  if(S.sub === "inv") return renderInv(v);
  if(S.sub === "sup") return renderSup(v);
  if(S.sub === "xar") return renderXar(v);
  if(S.sub === "cli") return renderCli(v);
  if(S.sub === "my")  return renderMy(v);
  if(S.sub === "log") return renderLog(v);

/* инвентаризация */
function renderInv(v){
  if(!S.inv){
    S.inv = {};
    PRODUCTS.forEach(p => { S.inv[p.id] = {}; packsOf(p).forEach(k => S.inv[p.id][k] = ""); });
  }
  v.innerHTML = backBtn() + `<h2 class="sec">${t("inv_h")}</h2>
    <p class="note" style="margin:0 0 10px">${t("inv_p")}</p>
    <div class="card" style="padding:10px 14px">
      ${PRODUCTS.map(p => `<div style="padding:8px 0;border-top:1px solid var(--line)">
        <div style="font-weight:650;font-size:14.5px;margin-bottom:6px">${p.name}</div>
        <div style="display:grid;grid-template-columns:repeat(${packsOf(p).length},1fr);gap:8px">
        ${packsOf(p).map(k => `<div>
          <div style="font-size:11px;color:var(--muted);margin-bottom:3px">${k} ${t("kg")} · ${p.stock[k]}</div>
          <input class="ivn" data-p="${p.id}" data-k="${k}" type="number" inputmode="numeric"
            placeholder="—" value="${S.inv[p.id][k]}"
            style="width:100%;height:42px;text-align:center;border:1.5px solid var(--line);border-radius:10px;font-size:15px;font-weight:650">
        </div>`).join("")}</div></div>`).join("")}
    </div>
    <div class="card" id="inv-res"></div>
    <button class="btn dark" id="inv-go">${t("inv_done")}</button>`;
  wireBack();
  const calc = () => {
    let dp=0, dkg=0, dsum=0;
    PRODUCTS.forEach(p => packsOf(p).forEach(k => {
      const val = S.inv[p.id][k];
      if(val === "" || val === null) return;
      const d = (+val) - p.stock[k];
      dp += d; dkg += d*k; dsum += d*bp(p.id,k);
    }));
    $("#inv-res").innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <span style="font-size:13px;color:var(--ink2)">${t("inv_diff")}</span>
        <b style="font-size:20px;color:${dsum<0?"var(--bad)":dsum>0?"var(--warn)":"var(--good)"}">
          ${dsum>0?"+":""}${fmt(dsum)} ${t("sum")}</b></div>
      <div class="note" style="margin-top:4px">${dp>0?"+":""}${dp} ${t("pcs")} · ${dkg>0?"+":""}${fmt(dkg)} ${t("kg")}
        · ${dsum<0?t("inv_bad"):t("inv_ok")}</div>`;
  };
  v.querySelectorAll(".ivn").forEach(i => i.oninput = () => {
    S.inv[i.dataset.p][i.dataset.k] = i.value; calc();
  });
  calc();
  $("#inv-go").onclick = () => {
    if(API){
      const counts = {};
      PRODUCTS.forEach(p => { counts[p.id] = {};
        packsOf(p).forEach(k => { const v = S.inv[p.id][k]; if(v !== "" && v !== null) counts[p.id][k] = +v; }); });
      apiDo("inventory", {counts}).then(() => { S.inv = null; S.sub = null; renderMore(); });
      return;
    }
    let dsum = 0;
    PRODUCTS.forEach(p => packsOf(p).forEach(k => {
      const val = S.inv[p.id][k];
      if(val === "" || val === null) return;
      dsum += ((+val) - p.stock[k]) * bp(p.id,k);
      p.stock[k] = +val;
    }));
    logIt("a_inv", `${dsum>0?"+":""}${fmt(dsum)} ${t("sum")}`);
    S.inv = null; S.sub = null; renderMore(); renderGrid();
  };
}

/* клиенты */
function renderCli(v){
  const stat = {}, debt = {};
  S.sales.filter(s => !s.returned && s.client).forEach(s => {
    stat[s.client] = stat[s.client] || {sum:0,kg:0,last:s.at};
    stat[s.client].sum += s.sum; stat[s.client].kg += s.kg; stat[s.client].last = s.at;
    if(s.debt > 0) debt[s.client] = (debt[s.client]||0) + s.debt;
  });
  const q = (S.cq2||"").trim().toLowerCase();
  const all = liveClients();
  const list = q ? all.filter(c =>
      c.name.toLowerCase().includes(q) || (c.phone||"").replace(/\s/g,"").includes(q.replace(/\s/g,"")))
    : all;
  v.innerHTML = backBtn() + `<h2 class="sec">${t("m_cli")}</h2>
    <div class="field"><input id="cq" placeholder="${t("cli_find")}" value="${esc(S.cq2||"")}"></div>
    ${list.length ? list.map(c => {
      const s = stat[c.id], own = c.price && PACKS.some(k => +c.price[k] && +c.price[k] !== PRICE[k]);
      return `<div class="card" style="padding:12px 14px">
        <div style="display:flex;justify-content:space-between;align-items:baseline">
          <b style="font-size:15.5px">${esc(c.name)}</b>
          <b style="font-size:15px">${s?fmt(s.sum):"—"}</b></div>
        <div class="note" style="margin-top:2px">${esc(c.phone)}${s?` · ${t("cli_took")} ${fmt(s.kg)} ${t("kg")}`:""}
          ${debt[c.id]?` · <b style="color:var(--bad)">${t("debt")} ${fmt(debt[c.id])}</b>`:""}</div>
        <div class="prices">${PACKS.map(k => {
          const pr = priceOf(c.id, k);
          return `<div class="pc${pr!==PRICE[k]?" own":""}"><span>${k} ${t("kg")}</span><b>${fmt(pr)}</b></div>`;
        }).join("")}</div>
        ${isDir() || isChk() ? `<div class="row2" style="margin-top:8px">
          <button class="btn ghost sm" data-e="${c.id}">${t("cli_edit")}</button>
          ${isDir() ? `<button class="btn ghost sm" data-x="${c.id}" style="color:var(--bad)">${t("cli_del")}</button>` : ""}
        </div>` : ""}
      </div>`; }).join("") : `<p class="empty">${q?t("cli_nf"):t("cli_none")}</p>`}
    <h2 class="sec">${t("cli_add")}</h2>
    <div class="card"><div class="field"><label>${t("cli_name")}</label><input id="cn"></div>
      <div class="field"><label>${t("cli_phone")}</label><input id="cp" placeholder="+998"></div>
      <div class="field"><label>${t("cli_own")}</label>
        <div class="row3">${PACKS.map(k => `<div><div class="pl">${k} ${t("kg")}</div>
          <input class="c-pr" data-k="${k}" type="number" inputmode="numeric" value="${PRICE[k]}"></div>`).join("")}</div></div>
      <button class="btn dark sm" id="cadd">${t("cli_add")}</button>
      <p class="note">${t("cli_note")}</p></div>`;
  wireBack();
  const cq = $("#cq");
  cq.oninput = () => { S.cq2 = cq.value; const pos = cq.selectionStart; renderCli(v);
    const el = $("#cq"); el.focus(); el.setSelectionRange(pos, pos); };
  $("#cadd").onclick = () => {
    const n = $("#cn").value.trim(); if(!n) return;
    const price = {};
    v.querySelectorAll(".c-pr").forEach(i => price[i.dataset.k] = +i.value || PRICE[i.dataset.k]);
    const phone = $("#cp").value.trim();
    if(API){ apiDo("add_client", {name:n, phone, price}).then(() => renderCli(v)); return; }
    S.clients.push({id:now().getTime(), name:n, phone, price});
    logIt("a_cli", esc(n));
    renderCli(v);
  };
  v.querySelectorAll("[data-e]").forEach(b => b.onclick = () => editClient(+b.dataset.e, v));
  v.querySelectorAll("[data-x]").forEach(b => b.onclick = () => delClient(+b.dataset.x, v));
}

/* удаление клиента — с подтверждением и проверкой долга */
function delClient(id, v){
  const c = clientOf(id); if(!c) return;
  const owes = debts().filter(d => d.client === id).reduce((a,d) => a + d.debt, 0);
  $("#sheet-in").innerHTML = `
    <div class="sh-h"><div style="flex:1"><b>${esc(c.name)}</b><span>${esc(c.phone||"")}</span></div></div>
    ${owes ? `<div class="card" style="margin:2px 0 0;padding:12px 14px;border-left:3px solid var(--bad)">
        <b style="color:var(--bad)">${t("cli_del_debt")}</b>
        <p class="note" style="margin-top:4px">${t("debt")}: <b>${fmt(owes)} ${t("sum")}</b></p></div>
      <button class="btn ghost" id="dc-no" style="margin-top:14px">${t("ret_no")}</button>`
    : `<p class="note" style="margin-top:2px">${t("cli_del_q")}</p>
      <button class="btn red" id="dc-yes" style="margin-top:14px">${t("cli_del_yes")}</button>

}
