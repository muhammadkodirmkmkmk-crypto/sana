            <span>${hhmm(new Date(s.at))}${s.client?" · "+esc(clientName(s.client)):" · "+t("noclient")}</span></div>
          <div class="b"><span class="tag ${s.returned?"late":s.status}">${s.returned?t("returned")
            :t(s.status==="sent"?"ch_wait":s.status==="ok"?"st_ok":"ch_paidd")}</span>
            <span>${s.items.map(x => `${P[x.id]?P[x.id].name:""} ${x.pack}×${x.n}`).join(" · ")}</span></div>
        </button>`).join("")}</div>`).join("")
      : `<p class="empty">${t("r_none")}</p>`}`;
  wireBack();
  v.querySelectorAll("[data-s]").forEach(b => b.onclick = () => {
    const s = S.sales.find(x => x.id === +b.dataset.s);
    if(!s) return;
    if(SEEM()) return openChek(s.id);
    $("#sheet-in").innerHTML = `
      <div class="sh-h"><div style="flex:1"><b>${fmt(s.kg)} ${t("kg")}</b>
        <span>${hhmm(new Date(s.at))}${s.client?" · "+esc(clientName(s.client)):""}</span></div>
        <span class="tag ${s.status}">${t(s.status==="sent"?"ch_wait":s.status==="ok"?"st_ok":"ch_paidd")}</span></div>
      ${s.items.map(x => `<div class="li"><img src="${P[x.id]?P[x.id].img:""}" alt="">
        <div class="m"><b>${P[x.id]?P[x.id].name:""}</b><span>${x.pack} ${t("kg")} × ${x.n} ${t("pcs")}</span></div>
        <div class="r"><b>${fmt(x.pack*x.n)} ${t("kg")}</b></div></div>`).join("")}
      <div class="sum-row"><span>${t("r_kg")}</span><b>${fmt(s.kg)} ${t("kg")}</b></div>
      ${s.returned?`<p class="note">${t("returned")}</p>`:""}`;
    openBg();
  });
}

/* журнал: что произошло, с кем и на какую сумму */
const dmy = d => (d || "").split("-").reverse().slice(0,2).join(".");
/* в журнале сумма пишется полностью и, если крупная, ещё и коротко: «1 000 000 so'm · 1 mln» */
/* длинные числа внутри текста тоже разбиваем по тысячам */
const spaceNums = s => esc(s).replace(/\d{5,}/g, m => fmt(+m));
function logMain(s){
  const raw = String(s == null ? "" : s).trim();
  if(!/^\d[\d\s]*$/.test(raw)) return spaceNums(raw);
  const n = +raw.replace(/\s/g, "");
  const [v, u] = mny(n);
  return `${fmt(n)} <small style="font-weight:600;font-size:12.5px;color:var(--muted)">`
       + `${t("sum")}${n >= 1e6 ? " · " + v + " " + u : ""}</small>`;
}
function renderLog(v){
  const q = (S.lq || "").trim().toLowerCase();
  const all = S.log.slice().reverse();
  const list = q ? all.filter(l =>
      (t(l.kind) + " " + l.text + " " + whoName(l.who)).toLowerCase().includes(q)) : all;
  const days = {};
  list.forEach(l => { const d = l.day || iso(new Date(l.at)); (days[d] = days[d] || []).push(l); });
  const keys = Object.keys(days).sort().reverse();
  v.innerHTML = backBtn() + `<h2 class="sec">${t("m_log")}</h2>
    <div class="field"><input id="lq" placeholder="${t("log_find")}" value="${esc(S.lq||"")}"></div>
    ${keys.length ? keys.map(d => `<h2 class="sec">${d === today() ? t("d_day") : dmy(d)}</h2>
      <div class="chs">${days[d].map((l,i) => {
        const [main, det] = String(l.text || "").split("|");
        return `<button class="ch" data-l="${d}:${i}">
          <div class="a"><b>${main ? logMain(main) : t(l.kind)}</b>
            <span>${hhmm(new Date(l.at))} · ${whoName(l.who)}</span></div>
          <div class="b"><span class="tag n">${t(l.kind)}</span>
            <span style="text-align:right">${spaceNums(det || "")}</span></div>
        </button>`; }).join("")}</div>`).join("")
      : `<p class="empty">${q ? t("cli_nf") : t("log_none")}</p>`}`;
  wireBack();
  v.querySelectorAll("[data-l]").forEach(b => b.onclick = () => {
    const [d, i] = b.dataset.l.split(":");
    openLog(days[d][+i], v);
  });
  const lq = $("#lq");
  lq.oninput = () => { S.lq = lq.value; const pos = lq.selectionStart; renderLog(v);
    const el = $("#lq"); el.focus(); el.setSelectionRange(pos, pos); };
}

/* карточка записи журнала: полная расшифровка и переход к документу */
function openLog(l, v){
  const [main, det, ref] = String(l.text || "").split("|");
  const [kind, id] = (ref || "").split(":");
  const label = {chek:t("m_chek_open"), debt:t("m_debt_open"), sup:t("m_sup_open"),
                 xar:t("m_xar_open"), cli:t("m_cli_open")}[kind];
  $("#sheet-in").innerHTML = `
    <div class="sh-h"><div style="flex:1"><b>${main ? logMain(main) : t(l.kind)}</b>
      <span>${dmy(l.day || iso(new Date(l.at)))} ${hhmm(new Date(l.at))} · ${whoName(l.who)}</span></div>
      <span class="tag n">${t(l.kind)}</span></div>
    <div class="card" style="margin:2px 0 0">
      ${det ? `<div style="font-size:14.5px;line-height:1.55">${spaceNums(det)}</div>`
            : `<p class="note" style="margin:0">${t("log_old")}</p>`}</div>
    ${label ? `<button class="btn dark" id="lg-go" style="margin-top:14px">${label}</button>` : ""}
    <button class="btn ghost" id="lg-x" style="margin-top:8px;background:none">${t("back")}</button>`;
  openBg();
  $("#lg-x").onclick = closeSheet;
  const go = $("#lg-go");
  if(go) go.onclick = () => {
    if(kind === "chek"){ const s = S.sales.find(x => x.id === +id);
      if(!s) return toast(t("log_gone")); return paintChek(s); }
    if(kind === "debt"){ const d = (S.mdebts||[]).find(x => x.id === +id);
      if(!d) return toast(t("log_gone")); closeSheet(); return openDebt(+id); }
    if(kind === "sup"){ const x = (S.supplies||[]).find(y => y.id === +id);
      if(!x) return toast(t("log_gone")); closeSheet(); return openSup(+id, v); }
    if(kind === "xar"){ closeSheet(); S.sub = "xar"; return renderMore(); }
    if(kind === "cli"){ closeSheet(); S.sub = "cli"; S.cq2 = ""; return renderMore(); }
  };
}

/* дневной отчёт для Telegram */
function renderTg(v){
  const live = S.sales.filter(s => DONE(s) && dayOf(s) === today());
  const sum = live.reduce((a,s)=>a+s.sum,0), kg = live.reduce((a,s)=>a+s.kg,0);
  const prof = sum - live.reduce((a,s)=>a+s.cost,0);
  const cash = live.filter(s=>s.status==="paid"&&s.pay==="cash").reduce((a,s)=>a+s.sum,0);
  const stock = allKg();
  const exp = Math.round(S.flourIn*norm()), d = S.produced - exp;
  const txt =
`📊 Sana Bogatir — ${now().toLocaleDateString(LANG==="ru"?"ru-RU":"uz-UZ")}

${t("r_sales")}: ${fmt(sum)} ${t("sum")} (${live.length} ${t("r_checks")})
${t("r_kg")}: ${fmt(kg)} ${t("kg")}
${t("r_gross")}: ${fmt(prof)} ${t("sum")}
${t("x_today")}: ${fmt(expToday())} ${t("sum")}
${t("r_net")}: ${fmt(prof - xarDayAll())} ${t("sum")}
${t("cash")}: ${fmt(cash)} ${t("sum")}

${t("st_total")}: ${fmt(stock)} ${t("kg")}
${t("r_diff")}: ${d>0?"+":""}${fmt(d)} ${t("kg")} ${d<0?"⚠️":"✅"}
${t("fl_new")}: ${S.sales.filter(SENT).length} ${t("fl_wait")}
${t("tg_debt")}: ${fmt(debtSum())} ${t("sum")} (${debtDue().length} ${t("d_now").toLowerCase()})`;
  v.innerHTML = backBtn() + `<h2 class="sec">${t("m_tg")}</h2>
    <div class="tg">${esc(txt)}</div>
    <p class="note">${LANG==="ru"
      ? "Такое сообщение будет приходить директору каждый вечер."
      : "Bunday xabar direktorga har kuni kechqurun keladi."}</p>`;
  wireBack();
}

/* выгрузка */
function renderExp(v){
  v.innerHTML = backBtn() + `<h2 class="sec">${t("m_exp")}</h2>
    <div class="card"><p class="note" style="margin:0 0 12px">${S.sales.length} ${t("r_checks")}</p>
      <button class="btn dark sm" id="dl">${t("m_exp")}</button></div>`;
  wireBack();
  $("#dl").onclick = () => {
    const head = ["sana","vaqt","sotuvchi","holat","mahsulot","oram_kg","dona","summa","tannarx","tolov","mijoz","bekor"];
    const rows = [];
    S.sales.forEach(s => s.items.forEach(x => {
      const cl = S.clients.find(c=>c.id===s.client);
      rows.push([s.at.toLocaleDateString(), hhmm(s.at), whoName(s.by), s.status, P[x.id].name, x.pack, x.n,
        lp(x)*x.n, cost(x.pack)*x.n, s.pay?t(s.pay):"", cl?cl.name:"", s.returned?"1":""]);
    }));
    const csv = "﻿" + [head, ...rows].map(r=>r.join(";")).join("\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv"}));
    a.download = "sana-savdo.csv"; a.click();
  };
}

/* настройки */
function renderSet(v){
  v.innerHTML = backBtn() + `<h2 class="sec">${t("m_set")}</h2>
    <div class="card">
      <div class="field"><label>${t("set_flour")}</label>
        <input id="s-fl" type="number" inputmode="numeric" placeholder="5500" value="${S.flourPrice||""}">
        ${S.flourLots.length ? `<p class="note" style="margin-top:6px">${t("set_favg")} <b>${fmt(flourAvg())}</b> · ${S.flourLots.length} ${t("set_lots")}</p>` : ""}</div>
      <div class="field"><label>${t("set_norm")}</label>
        <input id="s-nm" type="number" inputmode="decimal" step="0.5" placeholder="92" value="${Math.round(norm()*1000)/10}"></div>
      <div class="row2">
        ${[1,5,12].map(k=>`<div class="field"><label>${t("set_pack")} ${k} ${t("kg")}</label>
          <input class="s-pk" data-k="${k}" type="number" inputmode="numeric"
            placeholder="${{1:400,5:900,12:1600}[k]}" value="${S.packCost[k]||""}"></div>`).join("")}
      </div>
      <button class="btn dark" id="s-go">${t("set_save")}</button>
      <p class="note">${t("set_note2")}</p>
      <p class="note" id="tw">${timeNote()}</p></div>
    <div class="card"><table><thead><tr><th>${t("i_pack")}</th><th>${t("th_cost")}</th>
      <th>${t("th_price")}</th><th>${t("th_marg")}</th></tr></thead>
      <tbody id="s-tb"></tbody></table></div>`;
  wireBack();
  const tb = () => $("#s-tb").innerHTML = [1,5,12].map(k=>{
    const c=cost(k), m=PRICE[k]-c;
    return `<tr><td>${k} ${t("kg")}</td><td>${c ? fmt(c) : t("e_dash")}</td><td>${fmt(PRICE[k])}</td>
      <td>${c ? `<b style="color:${m>0?"var(--good)":"var(--bad)"}">${Math.round(100*m/PRICE[k])}%</b>`

      return;
    }
    S.flourPrice = fp;
    if(nm > 30 && nm <= 100) S.norm = nm/100;
    v.querySelectorAll(".s-pk").forEach(i => S.packCost[i.dataset.k] = +i.value || 0);
    logIt("a_set", t("set_flour")+" "+fmt(S.flourPrice));
    tb(); flash($("#s-go"));
  };
}

/* ------------------------------------------------ каркас */

function buildNav(){
  const items = isDir()
    ? [["sell","▦","n_sell"],["chek","✓","n_chek"],["stock","▤","n_stock"],["rep","◔","n_rep"],["more","⋯","n_more"]]
    : isChk()
    ? [["chek","✓","n_chek"],["more","⋯","n_more"]]
    : isStore()
    ? [["in","＋","n_in"],["stock","▤","n_stock"],["more","⋯","n_more"]]
    : [["sell","▦","n_sell"],["more","≡","m_my"]];
  $("#nav").style.gridTemplateColumns = `repeat(${items.length},1fr)`;
  $("#nav").innerHTML = items.map(([v,i,k]) =>
    `<button data-v="${v}" class="${S.view===v?"on":""}"><i>${i}</i><span>${t(k)}</span></button>`).join("");
  $("#nav").querySelectorAll("button").forEach(b => b.onclick = () => show(b.dataset.v));
  const h = 58 + (window.visualViewport ? 0 : 0);
  $("#cart").style.bottom = `calc(${h}px + env(safe-area-inset-bottom))`;
}

function show(v){
  S.view = v;
  if(v === "more" && isSell() && !S.sub){ S.sub = "my"; }
  ["sell","chek","stock","rep","in","more"].forEach(k =>
    $("#v-"+k).classList.toggle("hide", k !== v));
  $("#ttl").firstChild.textContent = (v === "more" && isSell()) ? t("m_my") : t("t_"+v);
  if(v==="chek")  renderChek($("#v-chek"));
  if(v==="in")    renderIn($("#v-in"));
  if(v==="stock") renderStock();
  if(v==="rep")   renderRep();
  if(v==="more")  renderMore();
  buildNav(); drawCart(); scrollTo(0,0);
}

function applyLang(){
  document.documentElement.lang = LANG;
  $("#lang").textContent = LANG==="uz" ? "RU" : "UZ";
  $("#lg-sub").textContent = t("lg_sub");
  $("#lg-d").textContent = t("role_d"); $("#lg-ds").textContent = t("role_ds");
  $("#lg-c").textContent = t("role_c") + " — " + t("checker_nm");
  $("#lg-cs").textContent = t("role_cs");
  $("#lg-w").textContent = t("role_w"); $("#lg-ws").textContent = t("role_ws");
  $("#lg-s").textContent = t("role_s") + " — " + t("seller_nm");
  $("#lg-ss").textContent = t("role_ss");
  document.querySelectorAll("[data-i]").forEach(n => n.textContent = t(n.dataset.i));
  if(S.role){ $("#sub").textContent = whoName(S.role); renderGrid(); show(S.view); }
}

$("#lang").onclick = () => { LANG = LANG==="uz" ? "ru" : "uz"; applyLang(); };
$("#out").onclick = () => logout();
$("#bg").onclick = closeSheet;
$("#cart-go").onclick = () => { drawCheck(); openBg(); };

/* ============================================================
   Серверный режим. Если файл открыт с сервера — данные в базе,
   если просто файл на диске — прежний офлайн-прототип.
   ============================================================ */
const API = location.protocol === "http:" || location.protocol === "https:";
let TOKEN = API ? (localStorage.getItem("sana_t") || "") : "";
let BUSY = false;

function toast(msg){
  let el = $("#toast");
  if(!el){ el = document.createElement("div"); el.id = "toast";
    el.style.cssText = "position:fixed;left:50%;bottom:76px;transform:translateX(-50%);z-index:60;"+
      "background:#0A273D;color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;"+
      "max-width:88vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.3)";
    document.body.appendChild(el); }
  el.textContent = msg; el.style.opacity = "1";
  clearTimeout(el._t); el._t = setTimeout(() => el.style.opacity = "0", 2600);
}

async function apiFetch(path, opts){
  const r = await fetch(path, {...opts, headers:{
    "content-type":"application/json", "authorization":"Bearer "+TOKEN, ...(opts||{}).headers}});
  if(r.status === 401 || r.status === 403){ logout(); throw new Error("auth"); }
  const d = await r.json().catch(() => ({}));
  if(!r.ok) throw new Error(d.error || r.status);
  return d;
}

/* одно действие → сервер пересчитывает и возвращает всё состояние */
async function apiDo(action, data){
  if(BUSY) return;
  BUSY = true;
  try{
    const d = await apiFetch("/api/do", {method:"POST", body:JSON.stringify({action, data})});
    applyState(d); redraw();
  }catch(e){
    if(String(e.message).startsWith("stock:")) toast(t("no_stock") + ": " + e.message.slice(6));
    else if(e.message !== "auth") toast(String(e.message));
  }finally{ BUSY = false; }
}

function applyState(d){
  if(d.server_time){ TIME_OFF = new Date(d.server_time).getTime() - Date.now(); TIME_SRC = "server"; }
  d.products.forEach(p => { const o = P[p.id]; if(o){ o.stock = p.stock; if(p.packs) o.packs = p.packs; } });
  S.clients = d.clients;
  S.sales = d.sales.map(x => ({...x, day:String(x.at).slice(0,10), at:new Date(x.at),
    pays:(x.pays||[]).map(y => ({...y, at:new Date(y.at)}))}));
  S.log = d.log.map(x => ({...x, day:String(x.at).slice(0,10), at:new Date(x.at)}));
  S.supplies = (d.supplies||[]).map(x => ({...x, at:new Date(x.at)}));
  S.expenses = d.expenses || [];
  S.flourLots = (d.flourLots||[]).map(x => ({...x, at:new Date(x.at)}));
  S.mdebts = (d.debts||[]).map(x => ({...x, at:new Date(x.at)}));
  const c = d.settings || {};
  S.norm = c.norm; S.flourPrice = c.flourPrice; S.packCost = c.packCost;
  S.exp = c.exp; S.flourIn = c.flourIn; S.produced = c.produced;
  S.qopUsed = +c.qopUsed || 0;
  S.today = d.today || null;
  if(d.names) NAMES_SRV = d.names;
  S.role = d.role;
}
let NAMES_SRV = null;

function redraw(){
  renderGrid(); drawCart();
  if(S.view === "chek") renderChek($("#v-chek"));
  else if(S.view === "stock") renderStock();
  else if(S.view === "rep") renderRep();
  else if(S.view === "in") renderIn($("#v-in"));
  else if(S.view === "more") renderMore();
}

async function enter(role){
  $("#login").classList.add("hide");
  S.role = role; S.tab = "sent";
  $("#sub").textContent = whoName(role);
  if(API){ try{ applyState(await apiFetch("/api/state")); }catch(e){ return; } startPolling(); }
  renderGrid(); show(isChk() ? "chek" : isStore() ? "in" : "sell");
}

function logout(){
  TOKEN = ""; if(API) localStorage.removeItem("sana_t");
  S.role = null; S.view = "sell"; S.sub = null; S.cart = []; S.client = null;
  $("#lg-pin").classList.add("hide"); $("#lg-roles").classList.remove("hide");
  $("#login").classList.remove("hide"); drawCart();
}

/* выбор роли: офлайн — сразу вход, на сервере — запрос PIN */
let PIN_ROLE = null;
document.querySelectorAll("#login #lg-roles button").forEach(b => b.onclick = () => {
  const role = b.dataset.r;
  if(!API){ enter(role); return; }
  PIN_ROLE = role;
  $("#lg-roles").classList.add("hide");
  $("#lg-pin").classList.remove("hide");
  $("#pin-who").textContent = whoName(role);
  $("#pin-sub").textContent = t("pin_ask");
  $("#pin-err").textContent = ""; $("#pin-in").value = ""; $("#pin-in").focus();
});
$("#pin-bk").onclick = () => { $("#lg-pin").classList.add("hide"); $("#lg-roles").classList.remove("hide"); };
$("#pin-go").onclick = async () => {
  try{
    const d = await (await fetch("/api/login", {method:"POST", headers:{"content-type":"application/json"},
      body:JSON.stringify({role:PIN_ROLE, pin:$("#pin-in").value})})).json();
    if(!d.token){ $("#pin-err").textContent = t("pin_bad"); return; }
    TOKEN = d.token; localStorage.setItem("sana_t", TOKEN);
    $("#lg-pin").classList.add("hide"); $("#lg-roles").classList.remove("hide");
    await enter(d.role);
  }catch(e){ $("#pin-err").textContent = t("pin_bad"); }
};
$("#pin-in").onkeydown = e => { if(e.key === "Enter") $("#pin-go").click(); };

/* человек что-то заполняет — перерисовывать нельзя, иначе набранное пропадёт */
function isTyping(){
  const a = document.activeElement;
  if(a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)) return true;
  return [...document.querySelectorAll("main input")].some(i => i.value !== "");
}

/* тихое обновление: чеки от других сотрудников появляются сами */
let POLL = null;
function startPolling(){
  if(!API || POLL) return;
  POLL = setInterval(async () => {
    if(!S.role || BUSY || $("#sheet").classList.contains("on") || isTyping()) return;
    try{ applyState(await apiFetch("/api/state")); redraw(); }catch(e){}
  }, 15000);
}

/* уже входили с этого устройства — заходим сразу */
if(API && TOKEN){
  apiFetch("/api/state").then(d => { applyState(d); enter(d.role); }).catch(() => {});
}

applyLang();
</script>
